    function pickMock(i) {
      mock.picks[mock.idx] = i;
      const it = mock.list[mock.idx];
      if (it.sec === 'listen') stopSpeech();
      if (mock.idx < mock.list.length - 1) mockGo(mock.idx + 1);
      else renderMockQuestion();
    }
    function mockNav(d) { stopSpeech(); mockGo(mock.idx + d); }
    function finishMock() {
      if (!mock) return;
      stopSpeech();
      clearInterval(mock.iv);
      const secs = ['lang', 'read', 'listen'];
      const cnt = { lang: [0, 0], read: [0, 0], listen: [0, 0] };
      const wrong = [];
      mock.list.forEach((it, i) => {
        const pick = mock.picks[i];
        cnt[it.sec][1]++;
        const ok = pick === it.answer;
        if (ok) cnt[it.sec][0]++;
        else wrong.push({ it, pick });
        if (pick == null) return;   // 안 푼 문제는 기록하지 않음
        if (it.wordId) {
          if (ok) { if (studyState.quizWrongCount[it.wordId] > 0) studyState.quizWrongCount[it.wordId]--; }
          else studyState.quizWrongCount[it.wordId] = (studyState.quizWrongCount[it.wordId] || 0) + 1;
          if (VTYPES.includes(it.tag) && curriculumIds.has(it.wordId)) vocabRecord(it.wordId, ok, it.tag);   // 틀린 어휘는 다음 날 '틀린 어휘 다시'로
        }
        if (it.drillId) recordResult('d:' + it.drillId, ok);
        if (it.readingKey) recordResult(it.readingKey, ok);
        if (it.listenId) recordResult(`l:${it.listenId}-${it.qi}`, ok);
      });
      const score = secs.map(k => cnt[k][1] ? Math.round(cnt[k][0] / cnt[k][1] * 60) : 0);
      const total = score[0] + score[1] + score[2];
      const sec = Math.round((Date.now() - mock.start) / 1000);
      const now = Date.now();
      const plan = MOCK_PLAN[mock.kind];
      // 본시험형: 교시별 시간 (청해를 시작하지 않고 끝내면 1교시만)
      const blockSec = plan.blocks ? [Math.round(((mock.b1End || now) - mock.start) / 1000), mock.b2 ? Math.round((now - mock.b2) / 1000) : 0] : null;
      setStamp('x:' + now, { m: mock.kind, d: todayStr(), s: score, c: secs.map(k => cnt[k][0]), n: secs.map(k => cnt[k][1]), sec, at: now, ...(blockSec ? { b: blockSec } : {}) });
      persist();
      const pass = mockPass(score);
      const weak = secs.filter((k, i) => score[i] < 19).map(k => SEC_LABEL[k]);
      const c = document.getElementById('quiz-container');
      c.innerHTML = `<div class="quiz-card" style="text-align:center; padding:26px 16px;">
          <h2>${pass ? '🎉 합격권' : '📌 아직 합격 기준 미달'}</h2>
          <div class="score-big">${total} <span style="font-size:1rem; color:var(--text-muted);">/ 180</span></div>
          <table class="mini-table" style="margin:10px 0;"><tr><th>영역</th><th>정답</th><th>추정 점수</th></tr>
            ${secs.map((k, i) => `<tr><td>${SEC_LABEL[k]}</td><td>${cnt[k][0]}/${cnt[k][1]}</td><td style="font-weight:800; color:${score[i] < 19 ? 'var(--accent-red)' : 'var(--text)'};">${score[i]}</td></tr>`).join('')}</table>
          <p style="color:var(--text-muted); font-size:0.85rem; line-height:1.6;">${blockSec ? `1교시 ${fmtSec(blockSec[0])} (목표 ${plan.blocks[0]}분) · 2교시 청해 ${fmtSec(blockSec[1])} (목표 ${plan.blocks[1]}분)` : `풀이 시간 ${fmtSec(sec)} (목표 ${plan.min}분)`}<br>${weak.length ? `기준점(19점) 미달: <b style="color:var(--accent-red);">${weak.join(', ')}</b>` : pass ? '합계 90점 이상 · 모든 영역 19점 이상' : '합계가 90점에 못 미칩니다'}</p>
          ${wrong.length ? `<div class="wrong-review-list"><div style="font-weight:700; margin:12px 0 4px;">틀리거나 안 푼 문제 (${wrong.length})</div>${wrong.map(({ it, pick }) => {
            const title = it.sec === 'listen' ? `🎧 ${LTYPE[listenById.get(it.listenId).type]} — ${listenById.get(it.listenId).qs[it.qi].q || listenById.get(it.listenId).lines[0][1]}` : it.sec === 'read' ? `📰 ${it.title}` : (it.q || '').replace(/<div class="passage-box">[\s\S]*?<\/div>/, '').replace(/<br><span[^>]*>.*?<\/span>$/, '');
            return `<div class="wrong-item" style="display:block;"><div class="wrong-word-sub" style="color:var(--heading);">${title}</div><div class="wrong-word-sub">${pick == null ? '미응답' : `고른 답: ${it.options[pick]}`} → 정답: <b>${it.options[it.answer]}</b></div><div class="wrong-word-sub">${it.desc || ''}</div></div>`;
          }).join('')}</div>` : ''}
          <div class="btn-row"><button class="btn btn-plain" onclick="mock = null; renderMockHome()">모의고사 목록</button><button class="btn btn-primary" onclick="switchTab('today')">오늘 탭으로</button></div>
        </div>`;
      mock = null;
    }

    // ===== 오늘 탭: 진도대로 이어서 할 일 =====
    // 원칙: 아직 안 끝난 첫 DAY(문법·독해·청해)를 이어서 → 어휘·모의고사·오늘의 장면·틀린 문제 보강
    // 날짜별 계획량·근무표·밀림 계산 없이, 끝낸 만큼 다음 DAY로 넘어감. 완료 여부는 각 탭에서 한 일(문제 풀이·완독)로 자동 판단합니다.
    // 단어는 실물 단어장으로 따로 하므로 여기에 넣지 않음.
    const DOW = ['일', '월', '화', '수', '목', '금', '토'];
    function dateObj(ds) { const [y, m, d] = ds.split('-').map(Number); return new Date(y, m - 1, d); }
    function fmtDate(ds) { const o = dateObj(ds); return `${o.getMonth() + 1}/${o.getDate()}(${DOW[o.getDay()]})`; }
    function md(ds) { const o = dateObj(ds); return `${o.getMonth() + 1}/${o.getDate()}`; }
    // 본시험형 모의고사: 정해 둔 날(PLAN.realMockDays)에만. 사흘 안에 미리 봤으면 그날은 빠짐
    function realMockDue(ds) {
      return PLAN.realMockDays.includes(ds) && !mockHistory().some(h => h.m === 'real' && h.d < ds && h.d >= addDays(ds, -3));
    }

    function maxStampT(keys) { let t = 0; keys.forEach(k => { const v = stampT(k); if (v > t) t = v; }); return t; }
    const RTYPE_SHORT = { short: '단문', mid: '중문', long: '장문', integrated: '통합이해', info: '정보검색', advanced: 'N1 심화' };

    // DAY 하나의 핵심 할 일 목록
    function dayTasks(day, ctx) {
      const tasks = [];
      // 단어는 실물 단어장으로 따로 → DAY 할 일은 문법·독해·청해
      // 1) 문법 (문형 + 문제)
      const pats = grammarDayPatterns(day), drills = drillsForDay(day);
      if (drills.length) {
        const done = drills.every(drillDone);
        tasks.push({ key: `${day}-g`, day, kind: 'grammar', done, doneAt: done ? maxStampT(drills.map(d => 'd:' + d.id)) : 0,
          title: `문법 문형 ${pats.length}개 + 문제 ${drills.length}개`, sub: pats.map(g => g.p).join(' · '), go: `goGrammar(${day})` });
      }
      // 2) 독해
      READINGS.filter(r => r.day === day && r.type !== 'advanced').forEach(r => {
        const done = ctx.read.has(r.id);
        tasks.push({ key: `r${r.id}`, day, kind: 'reading', done, doneAt: done ? stampT('r:' + r.id) : 0,
          title: `독해 ${RTYPE_SHORT[r.type]}: ${r.title}`, sub: `문제 ${(r.questions || []).length}문항 · 실전 목표 ${PLAN.readingTarget[r.type]}분 (타이머로 재 보기)`, go: `openReading(${r.id})` });
      });
      // 3) 청해
      const litems = listenItemsForDay(day);
      if (litems.length) {
        const done = litems.every(x => listenResult(x).done);
        const keys = litems.flatMap(x => x.qs.map((q, qi) => `l:${x.id}-${qi}`));
        const nq = litems.filter(x => x.type === 'quick').length;
        tasks.push({ key: `${day}-l`, day, kind: 'listen', done, doneAt: done ? maxStampT(keys) : 0,
          title: `청해 ${litems.length}세트`, sub: `즉시응답 ${nq} + ${litems.filter(x => x.type !== 'quick').map(x => LTYPE[x.type].split(' ·')[0]).join('·')}`, go: `goListen(${day})` });
      }
      return tasks;
    }
    // 아직 할 일이 남은 첫 DAY (모두 끝냈으면 totalDays + 1)
    function progressDayOf(ctx) {
      for (let d = 1; d <= PLAN.totalDays; d++) if (dayTasks(d, ctx).some(x => !x.done)) return d;
      return PLAN.totalDays + 1;
    }

    // 추가 과제 (그날 한 번 끝내면 완료)
    function extraTasks(ctx) {
      const ds = ctx.date, out = [];
      const t = key => stampV(`t:${ds}-${key}`) === 1;
      const tAt = key => stampT(`t:${ds}-${key}`);
      const mocksToday = mockHistory().filter(h => h.d === ds);
      const examEve = ds === addDays(PLAN.examDate, -1);
      // 모의고사: 본시험형은 정해 둔 날에만 / DAY 1~36을 다 끝낸 뒤에는 실전형(이틀 안에 큰 모의고사를 봤으면 미니)
      if (!examEve && ds <= addDays(PLAN.examDate, -2)) {
        const real = realMockDue(ds);
        const recentBig = mockHistory().some(h => (h.m === 'full' || h.m === 'real') && h.d < ds && h.d >= addDays(ds, -2));
        const kind = real ? 'real' : ctx.allDone ? (recentBig ? 'mini' : 'full') : '';
        const rank = { mini: 1, full: 2, real: 3 };   // 더 긴 모의고사를 봤으면 짧은 것도 한 것으로
        if (kind) {
          const done = mocksToday.some(h => (rank[h.m] || 0) >= rank[kind]);
          const realN = mockHistory().filter(h => h.m === 'real' && h.d < ds).length;
          out.push({ key: `${ds}-mock`, kind: 'mock', done, doneAt: done ? Math.max(...mocksToday.map(h => h.at || 0)) : 0,
            title: kind === 'real' ? `🎯 본시험형 모의고사 (155분 · ${realN + 1}회차)` : kind === 'full' ? '실전형 모의고사 (100분)' : '미니 모의고사 (30분)',
            sub: kind === 'real' ? '1교시 105분 → 쉬는 시간 → 청해 50분 · 시간이 안 되면 다른 날 모의고사 메뉴에서' : '언어지식 → 독해 → 청해 · 추정 점수 기록', go: `openMock()` });
        }
      }
      // 어휘: 틀린 어휘 다시 (나올 차례인 단어가 있으면 언제든) + 단어장을 끝낸 다음 날(11/17)부터 하루 어휘 실전 세트
      const dueV = Math.min(PLAN.vocabWrongSize, vocabDueWords().length);
      if (dueV || t('vwrong')) out.push({ key: `${ds}-vw`, kind: 'vwrong', done: t('vwrong'), doneAt: tAt('vwrong'), title: `🔁 틀린 어휘 다시${dueV ? ` (${dueV}문항)` : ''}`,
        sub: '전에 틀린 단어를 다른 유형으로 · 맞히면 3·7·14일 뒤에 한 번씩 더', go: `goQuizScope('vwrong')` });
      if (ds >= PLAN.vocabFrom || ctx.allDone) {
        const nSet = examEve ? 1 : PLAN.vocabSetsPerDay, doneSets = vocabSetsToday(ds);
        for (let k = 1; k <= nSet; k++) out.push({ key: `${ds}-vs${k}`, kind: 'vset', done: doneSets >= k, doneAt: doneSets >= k ? tAt('vset') : 0,
          title: `📝 어휘 실전 세트${nSet > 1 ? ` ${k}/${nSet}` : ''} (30문항)`, sub: '漢字読み→表記→語形成→文脈規定→言い換え→用法 · 안 푼 단어부터', go: `goQuizScope('vocab')` });
      }
      // 오늘의 장면: 모범 대화를 듣고 풀기 → 장면 단어 훑기. 그 대화를 오늘 풀면 완료
      if (SCENE_ROTATION.length) {
        const sc = todaySceneOf(ds), it = sceneListenOf.get(sc.id);
        const at = Math.max(0, ...it.qs.map((q, qi) => stampT(`l:${it.id}-${qi}`)));
        out.push({ key: `${ds}-scene`, kind: 'scene', done: at >= ctx.today0, doneAt: at >= ctx.today0 ? at : 0, title: `🎬 오늘의 장면: ${sc.title}`,
          sub: `${LTYPE[it.type].split(' · ')[0]} 대화 듣기 → 장면 단어 ${sceneCount(sc)}개 훑기`, go: `goTodayScene('${sc.id}')` });
      }
      const gw = ALL_DRILLS.filter(drillWrong).length;
      if (gw || t('gwrong')) out.push({ key: `${ds}-gw`, kind: 'gwrong', done: t('gwrong'), doneAt: tAt('gwrong'), title: `틀린 문법 문제 다시 (${Math.min(30, gw)}문항)`, sub: '맞히면 오답 목록에서 빠짐', go: `startGrammarDrill('wrong')` });
      const lw = [...LISTEN, ...SCENE_LISTEN].filter(x => listenResult(x).wrong).length;   // 장면 대화 오답 포함
      if (lw) out.push({ key: `${ds}-lw`, kind: 'lwrong', done: false, doneAt: 0, title: `틀린 청해 다시 듣기 (${lw}세트)`, sub: '스크립트를 보며 문장별로 다시 듣기', go: `goListenWrong()` });
      const rw = READINGS.filter(readingHasWrong).length;
      if (rw) out.push({ key: `${ds}-rw`, kind: 'rwrong', done: false, doneAt: 0, title: `틀린 독해 지문 다시 풀기 (${rw}편)`, sub: '근거 문장을 찾아 표시하며 다시 풀기', go: `goReadingWrong()` });
      const adv = READINGS.filter(r => r.type === 'advanced' && r.day < ctx.progressDay && !ctx.read.has(r.id));
      if (adv.length) out.push({ key: `r${adv[0].id}`, kind: 'reading', done: false, doneAt: 0, title: `N1 심화 칼럼: ${adv[0].title}`, sub: `긴 글 읽기 체력 · 남은 ${adv.length}편`, go: `openReading(${adv[0].id})` });
      if (examEve) {
        // 전날: 새 내용(N1 칼럼·독해 다시 풀기)은 빼고, 이미 푼 것만 짧게 다지기
        const keep = ['vwrong', 'vset', 'gwrong', 'lwrong'];
        return [{ key: `${ds}-ears`, kind: 'ears', done: t('ears'), doneAt: tAt('ears'), title: '청해 귀 풀기 — 즉시응답', sub: '짧은 문제 10개 정도로 소리에 귀를 맞추기', go: `goListenQuick('${ds}')` },
          ...out.filter(x => keep.includes(x.kind))];
      }
      return out;
    }

    function buildTodayPlan() {
      const date = todayStr();
      const ctx = { date, today0: startOfToday(), read: new Set(studyState.readCompleted) };
      const examEve = date === addDays(PLAN.examDate, -1);
      ctx.progressDay = progressDayOf(ctx);
      ctx.allDone = ctx.progressDay > PLAN.totalDays;
      // DAY 할 일: 오늘 끝낸 것(체크 표시) + 이어서 할 DAY / 다음 DAY는 접어서 미리 보기 (시험 전날은 새 DAY 없이 복습만)
      const tasks = [], next = [];
      if (!examEve) {
        for (let d = 1; d < ctx.progressDay; d++) dayTasks(d, ctx).forEach(x => { if (x.doneAt >= ctx.today0) tasks.push(x); });
        if (!ctx.allDone) dayTasks(ctx.progressDay, ctx).forEach(x => { if (!x.done || x.doneAt >= ctx.today0) tasks.push(x); });
        if (ctx.progressDay < PLAN.totalDays) dayTasks(ctx.progressDay + 1, ctx).forEach(x => { if (!x.done || x.doneAt >= ctx.today0) next.push(x); });
      }
      const extras = extraTasks(ctx).filter(x => !x.done || x.doneAt >= ctx.today0);
      // DAY 1~36 전체 할 일 중 끝낸 수
      let dayDone = 0, dayAll = 0;
      for (let d = 1; d <= PLAN.totalDays; d++) dayTasks(d, ctx).forEach(x => { dayAll++; if (x.done) dayDone++; });
      const doneToday = [...tasks, ...next, ...extras].filter(x => x.done && x.doneAt >= ctx.today0).length;
      return { date, examEve, progressDay: ctx.progressDay, allDone: ctx.allDone, tasks, next, extras, dayDone, dayAll, doneToday };
    }
    function planTasks(plan) { return [...plan.tasks, ...plan.extras, ...plan.next]; }

    // ===== 시험 당일·시험 후 =====
    const EXAM_CHECKS = ['수험표 (출력본)', '신분증 원본 (주민등록증·운전면허증·여권 등)', 'HB 연필(또는 샤프)·지우개', '아날로그 손목시계 (스마트워치는 불가)', '시험장 위치·교통편 — 입실 마감보다 30분 일찍 도착', '물·가벼운 간식 (쉬는 시간용)'];
    function toggleExamCheck(i) {
      const key = `t:${todayStr()}-chk${i}`;
      setStamp(key, stampV(key) === 1 ? 0 : 1);
      persist();
      renderToday();
    }
    function examDayHtml(date) {
      const checks = EXAM_CHECKS.map((label, i) => {
        const on = stampV(`t:${date}-chk${i}`) === 1;
        return `<div class="task-row ${on ? 'done' : ''}" onclick="toggleExamCheck(${i})"><span class="task-check">${on ? '✓' : ''}</span><div class="task-main"><div class="task-title">${label}</div></div></div>`;
      }).join('');
      return `<div class="exam-card">
        <div class="exam-title">🍀 오늘은 JLPT N2 시험 날</div>
        <div class="exam-sec">✅ 준비물 (눌러서 체크)</div>
        <div class="task-list" style="margin-bottom:0;">${checks}</div>
        <div class="exam-sec">⏱️ 언어지식(문자·어휘·문법)·독해 105분</div>
        <ul class="exam-tips">
          <li>문자·어휘 약 15분 → 문법 약 20분 → 독해 약 60분 → 답안지 확인 10분</li>
          <li>한 문제에 1분 넘게 막히면 표시해 두고 넘어가기 · 답안지는 빈칸 없이</li>
          <li>독해는 질문을 먼저 읽고, 본문에서 근거 문장을 찾기</li>
        </ul>
        <div class="exam-sec">🎧 청해 50분</div>
        <ul class="exam-tips">
          <li>과제이해는 「まず」「このあと」처럼 순서를 묻는 말에 집중</li>
          <li>즉시응답은 듣자마자 바로 고르고 다음 문제 준비</li>
          <li>놓친 문제는 바로 잊고 다음 문제로</li>
        </ul>
        <div class="exam-sec">🔥 워밍업 (선택 · 20분 이내)</div>
        <div class="btn-row">
          <button class="btn btn-plain" onclick="goListenQuick()">🎧 즉시응답으로 귀 풀기</button>
          <button class="btn btn-plain" onclick="goWrongAudio()">📒 다시 볼 어휘 듣기</button>
        </div>
        <div class="exam-note">새로운 것은 보지 말고 익숙한 것만 가볍게. 지금까지 충분히 준비했습니다!</div>
      </div>`;
    }
    function afterExamHtml() {
      const keys = Object.keys(studyState.stamps);
      const stat = (label, n) => `<div class="summary-item"><div class="summary-num">${n}</div><div class="summary-label">${label}</div></div>`;
      return `<div class="exam-card">
        <div class="exam-title">🎉 시험 끝! 정말 수고 많으셨어요</div>
        <div class="stat-grid-summary exam-stats">${stat('푼 어휘', keys.filter(k => k.startsWith('v:')).length)}${stat('완독한 독해', studyState.readCompleted.length)}${stat('푼 청해', keys.filter(k => k.startsWith('l:')).length)}${stat('푼 문법 문제', keys.filter(k => k.startsWith('d:')).length)}${stat('모의고사', mockHistory().length)}</div>
        <div class="exam-note">결과 발표 일정은 JLPT 공식 홈페이지에서 확인하세요. 어휘 문제·문법·청해는 그대로 쓸 수 있으니, 감을 유지하고 싶을 때 어휘 실전 세트 하나만 풀어도 충분합니다.</div>
        <div class="btn-row"><button class="btn btn-plain" onclick="goQuizScope('vocab')">📝 어휘 실전 세트 풀기</button></div>
      </div>`;
    }
    // 청해 탭의 즉시응답 목록으로 (전날 할 일에서 열면 완료로 표시)
    function goListenQuick(ds) {
      if (ds) { setStamp(`t:${ds}-ears`, 1); persist(); }
      listenFilter = 'quick'; listenMode = 'practice';
      switchTab('listen');
      window.scrollTo(0, 0);
    }
    function goWrongAudio() {
      stopAudioMode();
      audio.source = 'wrong'; audio.list = []; audio.idx = 0;
      saveAudioOpts();
      openAudioMode();
    }

    let todayPlanCache = null;
    function renderToday() {
      const plan = buildTodayPlan();
      todayPlanCache = plan;
      const { date, tasks, next, extras } = plan;
      const exam = PLAN.examDate;
      const dd = Math.round((dateObj(exam) - dateObj(date)) / 86400000);
      document.getElementById('today-date').textContent = dd === 0 ? `${fmtDate(date)} · JLPT N2` : fmtDate(date);
      document.getElementById('today-dday').textContent = dd > 0 ? `N2 D-${dd}` : dd === 0 ? '시험 당일!' : '시험 종료';
      let sub;
      if (dd === 0) sub = '오늘은 공부 목표 없이 시험에 집중하는 날입니다';
      else if (dd < 0) sub = '시험 종료 · 어휘 문제와 기록은 그대로 쓸 수 있습니다';
      else if (plan.examEve) sub = '내일 시험 · 새 공부 없이 짧게 복습만';
      else if (plan.allDone) sub = `DAY 1~${PLAN.totalDays} 모두 끝냄 · 어휘·모의고사·약점 보강`;
      else sub = `이어서 할 DAY ${plan.progressDay} / ${PLAN.totalDays}`;
      document.getElementById('today-sub').innerHTML = sub;
      const pct = plan.dayAll ? Math.round(plan.dayDone / plan.dayAll * 100) : 0;
      const checked = EXAM_CHECKS.filter((_, i) => stampV(`t:${date}-chk${i}`) === 1).length;
      document.getElementById('today-bar-fill').style.width = (dd === 0 ? Math.round(checked / EXAM_CHECKS.length * 100) : dd < 0 ? 100 : pct) + '%';
      document.getElementById('today-progress').textContent = dd === 0 ? `준비물 ${checked}/${EXAM_CHECKS.length} 챙김`
        : dd < 0 ? `${fmtDate(PLAN.startDate)}부터 ${Math.round((dateObj(exam) - dateObj(PLAN.startDate)) / 86400000)}일 동안 준비했습니다`
        : `DAY 할 일 ${plan.dayDone}/${plan.dayAll} 완료 (${pct}%)${plan.doneToday ? ` · 오늘 ${plan.doneToday}개 끝냄` : ''}`;

      // 기간 안내
      const ev = PLAN.events[date];
      let phase = '';
      if (dd === 0) phase = examDayHtml(date);
      else if (dd < 0) phase = afterExamHtml();
      else if (ev) phase = `<div class="warn-banner">📌 ${ev.note}</div>`;
      else if (extras.some(t => t.kind === 'mock' && /본시험형/.test(t.title) && !t.done)) phase = `<div class="warn-banner">🎯 오늘은 본시험형 모의고사 날 (155분) — 시험 시간대(오후)에 맞춰 1교시 105분 → 쉬는 시간 → 청해 50분으로 풀어 보세요. 시간이 안 되면 다른 날 🧪 모의고사 메뉴에서 봐도 됩니다.</div>`;
      else if (date < PLAN.vocabFrom) phase = `<div class="info-banner">📕 단어는 실물 단어장(${fmtDate(addDays(PLAN.vocabFrom, -1))}까지)으로 하고, 앱에서는 DAY 문법·독해·청해를 순서대로 이어서 풉니다. 하루에 몇 DAY를 할지는 정해 두지 않았으니 되는 만큼만 하세요. ${fmtDate(PLAN.vocabFrom)}부터 어휘 문제로 단어 복습.</div>`;
      else phase = `<div class="info-banner">🧪 실전 기간 (~${fmtDate(addDays(exam, -2))}): 단어장으로 외운 단어를 <b>어휘 실전 세트</b>(하루 ${PLAN.vocabSetsPerDay}세트)로 확인하고, 틀린 단어는 다음 날 '틀린 어휘 다시'로. 남은 DAY가 있으면 이어서 풀고, DAY 36까지 끝내면 실전형·미니 모의고사가 나옵니다.</div>`;
      document.getElementById('today-phase').innerHTML = phase;

      // 다음 할 일
      const nextTask = planTasks(plan).find(x => !x.done);
      const btn = document.getElementById('btn-next-task');
      if (dd <= 0) { btn.style.display = 'none'; }
      else if (nextTask) {
        btn.style.display = 'flex';
        btn.innerHTML = `<span>▶ 다음 할 일: ${escapeHtml(nextTask.title)}<small>${nextTask.day ? `DAY ${nextTask.day}` : '추가 과제'}</small></span><span>›</span>`;
      } else {
        btn.style.display = 'flex';
        btn.innerHTML = `<span>🎉 할 일을 모두 끝냈습니다!<small>남은 시간은 단어장·단어 듣기 모드·모의고사로</small></span><span>›</span>`;
      }

      // 할 일 목록: 이어서 할 DAY → 추가 과제 → (접어서) 다음 DAY
      const nextKey = nextTask ? nextTask.key : null;
      const row = x => `<div class="task-row ${x.done ? 'done' : ''} ${x.key === nextKey ? 'next' : ''}" onclick="runTask('${x.key}')">
          <span class="task-check">${x.done ? '✓' : ''}</span>
          <div class="task-main"><div class="task-title">${escapeHtml(x.title)}</div><div class="task-sub">${escapeHtml(x.sub || '')}</div></div></div>`;
      // DAY마다 제목 (오늘 끝낸 앞 DAY는 체크 표시로 남김)
      let lastDay = null;
      const dayHtml = tasks.map(x => {
        const head = x.day !== lastDay ? `<div class="task-divider">📘 DAY ${x.day}${x.day < plan.progressDay ? ' · 오늘 끝냄 ✓' : ''}</div>` : '';
        lastDay = x.day;
        return head + row(x);
      }).join('');
      document.getElementById('task-list').innerHTML = dd <= 0 ? '' :
        (plan.examEve ? '' : dayHtml || `<div class="task-divider">📘 DAY 1~${PLAN.totalDays} 완료</div><div class="task-row"><div class="task-main"><div class="task-sub">DAY 1~36의 문법·독해·청해를 모두 끝냈습니다.</div></div></div>`)
        + (extras.length ? `<div class="task-divider">➕ 추가 과제</div>${extras.map(row).join('')}` : '')
        + (next.length ? `<details class="task-more"><summary>▼ 다음 DAY ${plan.progressDay + 1} 미리 보기 (${next.length}개)</summary>${next.map(row).join('')}</details>` : '');

      renderBackupCard();
    }

    function runTask(key) {
      const plan = todayPlanCache || buildTodayPlan();
      const t = planTasks(plan).find(x => x.key === key);
      if (t) new Function(t.go)();
    }
    function goNextTask() {
      const plan = todayPlanCache || buildTodayPlan();
      const t = planTasks(plan).find(x => !x.done);
      if (t) new Function(t.go)();
      else openAudioMode();
    }
    // 할 일 → 해당 화면으로 이동
    function goGrammar(day) {
      if (currentDay !== day) changeDay(day);
      grefMode = 'day';
      try { localStorage.setItem('jlpt_gref_mode', 'day'); } catch (e) {}
      syncGrefModeButtons();
      switchTab('grammar');
      window.scrollTo(0, 0);
    }
    function goListen(day) {
      if (currentDay !== day) changeDay(day);
      listenFilter = 'day';
      listenMode = 'practice';
      switchTab('listen');
      window.scrollTo(0, 0);
    }
    function goListenWrong() { listenFilter = 'wrong'; listenMode = 'practice'; switchTab('listen'); }
    function goReadingWrong() {
      readingFilter = 'wrong';
      document.querySelectorAll('#tab-reading .chip').forEach(c => c.classList.toggle('active', c.dataset.rtype === 'wrong'));
      switchTab('reading');
    }
    function goQuizScope(scope) {
      // 같은 세트를 풀던 중이면 이어서
      if (quizScope === scope && !quizMeta.preset && currentQuizIdx < currentQuizList.length && (currentQuizIdx > 0 || quizAnswered)) { switchTab('quiz'); window.scrollTo(0, 0); return; }
      switchTab('quiz', null, true);
      quizScope = scope;
      document.querySelectorAll('#quiz-scope-bar .chip').forEach(c => c.classList.toggle('active', c.dataset.scope === scope));
      startQuiz();
      window.scrollTo(0, 0);
    }

    // ===== 통계 탭 =====
    function renderStatsDashboard() {
      const targetDate = new Date(PLAN.examDate + 'T00:00:00');
      const now = new Date();
      const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const diffDays = Math.round((targetDate - today0) / (1000 * 60 * 60 * 24));
      const ddayText = diffDays > 0 ? `D-${diffDays}일 남음` : (diffDays === 0 ? "D-Day 시험 당일!" : `시험 종료 (D+${Math.abs(diffDays)})`);
      document.getElementById('dday-display').textContent = ddayText;
      const [ey, em, ed] = PLAN.examDate.split('-').map(Number);
      document.getElementById('dday-sub').textContent = `🎯 ${ey}년 ${em}월 ${ed}일 JLPT N2 본시험`;


      // 학습 계획 (날짜별 계획량 없이 진도 기준)
      const nowDs = todayStr();
      const pctx = { read: new Set(studyState.readCompleted) };
      const prog = progressDayOf(pctx);
      const dayDoneN = d => { const l = dayTasks(d, pctx); return l.length && l.every(x => x.done); };
      const rows = `<div class="plan-row ${nowDs < PLAN.vocabFrom ? 'now' : ''}"><div class="plan-days">단어장<br><span style="font-weight:normal; color:var(--text-muted); font-size:0.78rem;">~${md(addDays(PLAN.vocabFrom, -1))}</span></div><div><b>실물 N2 단어장 (앱 밖에서)</b><br><span style="color:var(--text-muted);">${md(PLAN.vocabFrom)}부터 어휘 탭의 '어휘 문제'로 복습</span></div></div>`
        + PLAN.phases.map(p => {
        const inP = d => d >= p.from && d <= p.to;
        const nG = GREF.filter(g => inP(grammarDayOf.get(g.id))).length, nR = READINGS.filter(r => inP(r.day) && r.type !== 'advanced').length, nL = LISTEN.filter(x => inP(x.day)).length;
        let doneN = 0;
        for (let d = p.from; d <= p.to; d++) if (dayDoneN(d)) doneN++;
        return `<div class="plan-row ${inP(prog) ? 'now' : ''}"><div class="plan-days">DAY ${p.from}~${p.to}<br><span style="font-weight:normal; color:var(--text-muted); font-size:0.78rem;">끝낸 DAY ${doneN}/${p.to - p.from + 1}</span></div><div><b>${p.label}</b> (문형 ${nG} · 독해 ${nR}편 · 청해 ${nL}문제)<br><span style="color:var(--text-muted);">${p.note}</span></div></div>`;
      }).join('')
        + `<div class="plan-row"><div class="plan-days">본시험형<br><span style="font-weight:normal; color:var(--text-muted); font-size:0.78rem;">${PLAN.realMockDays.map(md).join('·')}</span></div><div><b>본시험형 모의고사</b><br><span style="color:var(--text-muted);">그날 '오늘' 탭에 나옴 · 155분 (1교시 105분 + 청해 50분) · 사흘 안에 미리 봤으면 빠짐 · 다른 날은 🧪 모의고사 메뉴에서</span></div></div>`
        + `<div class="plan-row ${nowDs >= PLAN.vocabFrom && nowDs < addDays(PLAN.examDate, -1) ? 'now' : ''}"><div class="plan-days">실전 기간<br><span style="font-weight:normal; color:var(--text-muted); font-size:0.78rem;">${md(PLAN.vocabFrom)}~${md(addDays(PLAN.examDate, -2))}</span></div><div><b>어휘 문제 + 모의고사 + 약점 보강</b><br><span style="color:var(--text-muted);">어휘 실전 세트 하루 ${PLAN.vocabSetsPerDay}개 + 틀린 어휘 다시 · 남은 DAY 이어서 · DAY 36까지 끝내면 실전형·미니 모의고사 · 오늘의 장면 · 틀린 문법·청해·독해 다시</span></div></div>`
        + `<div class="plan-row ${nowDs === addDays(PLAN.examDate, -1) ? 'now' : ''}"><div class="plan-days">시험 전날<br><span style="font-weight:normal; color:var(--text-muted); font-size:0.78rem;">${md(addDays(PLAN.examDate, -1))}</span></div><div><b>짧게 복습만</b><br><span style="color:var(--text-muted);">틀린 어휘 · 어휘 세트 1개 · 틀린 문법·청해 · 청해 귀 풀기 → 준비물 챙기고 일찍 자기</span></div></div>`;
      document.getElementById('plan-rows').innerHTML = rows;
      document.getElementById('plan-today').textContent = prog > PLAN.totalDays ? `DAY ${PLAN.totalDays}까지 모두 끝냄` : `이어서 할 DAY ${prog}`;

      // 어휘 문제 현황 ('v:' 기록): 맞힌 단어(통과) · 다시 볼 단어(틀려서 간격 복습 중) · 아직 안 푼 단어
      const totalWords = VOCAB.length || 1, byType = {};
      VTYPES.forEach(t => { byType[t] = [0, 0]; });
      let okCount = 0, cycCount = 0;
      VOCAB.forEach(w => {
        const v = vstat(w.id);
        if (!v) return;
        if (vInCycle(v)) cycCount++; else okCount++;
        if (byType[v.k] && v.r) { byType[v.k][1]++; if (v.r === 'o') byType[v.k][0]++; }
      });
      const okRate = Math.round(okCount / totalWords * 100) || 0, cycRate = Math.round(cycCount / totalWords * 100) || 0;
      document.getElementById('stat-total-percent').textContent = `${Math.round((okCount + cycCount) / totalWords * 100) || 0}% 풀어 봄`;
      document.getElementById('bar-memorized').style.width = `${okRate}%`;
      document.getElementById('bar-confused').style.width = `${cycRate}%`;
      document.getElementById('sum-mem').textContent = okCount;
      document.getElementById('sum-conf').textContent = cycCount;
      document.getElementById('sum-untouched').textContent = VOCAB.length - okCount - cycCount;
      document.getElementById('vocab-type-stats').innerHTML = `<table class="mini-table"><tr><th>유형 (단어별 마지막 결과)</th><th>정답률</th></tr>${VTYPES.map(t => `<tr><td>${VTYPE_INFO[t].no} ${QTAG[t]}</td><td>${byType[t][1] ? `<b>${Math.round(byType[t][0] / byType[t][1] * 100)}%</b> (${byType[t][0]}/${byType[t][1]})` : '<span style="color:var(--text-muted);">기록 없음</span>'}</td></tr>`).join('')}</table>
        <div style="font-size:0.78rem; color:var(--text-muted); margin-top:6px; line-height:1.5;">틀린 단어는 다음 날 → 3일 → 7일 → 14일 뒤 '틀린 어휘 다시'에 다른 유형으로 나오고, 마지막까지 맞히면 '맞힌 단어'로 넘어갑니다. 모의고사의 어휘 문제도 함께 기록됩니다.</div>`;

      const weaknessContainer = document.getElementById('weakness-list');
      weaknessContainer.innerHTML = '';

      const wrongList = weakWords().slice(0, 10);

      if (wrongList.length === 0) {
        weaknessContainer.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-muted); font-size:0.88rem;">어휘 문제에서 틀린 기록이 아직 없습니다.</div>`;
        document.getElementById('btn-quiz-weakness').style.display = 'none';
      } else {
        document.getElementById('btn-quiz-weakness').style.display = 'inline-flex';
        wrongList.forEach(entry => {
          const wObj = vocabById.get(entry.id);
          const row = document.createElement('div');
          row.className = 'wrong-item';
          row.innerHTML = `
            <div>
              <div class="wrong-word-info">${wObj.word}${wrongReading(wObj)}</div>
              <div class="wrong-word-sub">${wObj.mean}</div>
            </div>
            <span class="wrong-badge">${entry.count}회 오답</span>
          `;
          weaknessContainer.appendChild(row);
        });
      }

      const totalReadings = READINGS.length || 1;
      const readDoneCount = studyState.readCompleted.filter(id => READINGS.some(r => r.id === id)).length;
      document.getElementById('reading-read-rate').textContent = `${readDoneCount} / ${READINGS.length}편 (${Math.round((readDoneCount / totalReadings) * 100) || 0}%)`;

      // 독해 풀이 시간 (유형별 평균 vs 목표)
      const timeRows = ['short', 'mid', 'long', 'integrated', 'info', 'advanced'].map(type => {
        const secs = READINGS.filter(r => r.type === type).map(r => stampV('e:' + r.id)).filter(v => typeof v === 'number' && v > 0);
        if (!secs.length) return '';
        const avg = secs.reduce((a, b) => a + b, 0) / secs.length, target = PLAN.readingTarget[type] * 60;
        return `<tr><td>${RTYPE_SHORT[type]}</td><td>${secs.length}편</td><td style="font-weight:700; color:${avg > target ? 'var(--accent-red)' : 'var(--accent-green)'};">${fmtSec(avg)}</td><td>${fmtSec(target)}</td></tr>`;
      }).join('');
      document.getElementById('reading-time-stats').innerHTML = timeRows
        ? `<table class="mini-table" style="margin-top:4px;"><tr><th>유형</th><th>잰 지문</th><th>평균</th><th>목표</th></tr>${timeRows}</table>`
        : '지문 카드의 ⏱ 실전 타이머를 켜고 문제를 끝까지 풀면 풀이 시간이 기록됩니다. 문제를 다 풀면 완독도 자동 체크됩니다.';

      // 영역별 정답률 (문법 문제 · 독해 문제 · 청해)
      const rate = (vals) => { const done = vals.filter(Boolean); const ok = done.filter(v => v === 'o').length; return [ok, done.length]; };
      const gR = rate(ALL_DRILLS.map(d => stampV('d:' + d.id)));
      const rR = rate(READINGS.flatMap(r => (r.questions || []).map((q, qi) => stampV(`a:${r.id}-${qi}`))));
      const lTypes = ['quick', 'task', 'point', 'summary', 'integ'];
      const lR = lTypes.map(t => rate(LISTEN.filter(x => x.type === t).flatMap(x => x.qs.map((q, qi) => stampV(`l:${x.id}-${qi}`)))));
      const lAll = lR.reduce((a, b) => [a[0] + b[0], a[1] + b[1]], [0, 0]);
      const pctTxt = ([ok, n]) => n ? `<b>${Math.round(ok / n * 100)}%</b> (${ok}/${n})` : '<span style="color:var(--text-muted);">기록 없음</span>';
      document.getElementById('area-stats').innerHTML = `<table class="mini-table">
          <tr><th>영역</th><th>정답률</th><th>전체 문제</th></tr>
          <tr><td>📘 문법 (형식·배열·글의 문법)</td><td>${pctTxt(gR)}</td><td>${ALL_DRILLS.length}</td></tr>
          <tr><td>📝 용법 (用法)</td><td>${pctTxt(rate(USAGE_LINKED.map(u => stampV('d:' + u.id))))}</td><td>${USAGE_LINKED.length}</td></tr>
          <tr><td>📰 독해 문제</td><td>${pctTxt(rR)}</td><td>${READINGS.reduce((a, r) => a + (r.questions || []).length, 0)}</td></tr>
          <tr><td>🎧 청해 전체</td><td>${pctTxt(lAll)}</td><td>${LISTEN.reduce((a, x) => a + x.qs.length, 0)}</td></tr>
          ${lTypes.map((t, i) => lR[i][1] ? `<tr><td style="padding-left:16px; color:var(--text-muted);">└ ${LTYPE[t].split(' ·')[0]}</td><td>${pctTxt(lR[i])}</td><td></td></tr>` : '').join('')}
        </table>`;
      document.getElementById('mock-history').innerHTML = mockHistoryHtml(mockHistory());

      const grefDone = GREF.filter(g => studyState.grammarDone.includes(g.id)).length;
      const grefRate = GREF.length ? Math.round((grefDone / GREF.length) * 100) : 0;
      document.getElementById('gref-rate').textContent = `${grefDone} / ${GREF.length}개 (${grefRate}%)`;
      document.getElementById('bar-gref').style.width = `${grefRate}%`;

      // DAY별 할 일(문법·독해·청해) 완료 수
      document.getElementById('matrix-title').textContent = `📅 DAY 1 ~ ${PLAN.totalDays} 할 일 완료 (문법·독해·청해)`;
      const matrixGrid = document.getElementById('day-matrix-grid');
      matrixGrid.innerHTML = '';
      const mctx = { read: new Set(studyState.readCompleted) };
      for (let d = 1; d <= PLAN.totalDays; d++) {
        const cell = document.createElement('div');
        cell.className = 'day-cell';
        if (d === currentDay) cell.classList.add('active-day');
        const list = dayTasks(d, mctx), done = list.filter(x => x.done).length;
        if (!list.length) cell.classList.add('no-data');
        else if (done === list.length) cell.classList.add('complete');
        cell.innerHTML = `<div>D${d}</div><div style="font-size:0.68rem; opacity:0.8;">${list.length ? `${done}/${list.length}` : '—'}</div>`;
        cell.onclick = () => goGrammar(d);
        matrixGrid.appendChild(cell);
      }
    }

    function startWeaknessQuiz() {
      switchTab('quiz', document.getElementById('nav-quiz'), true);
      quizScope = 'weakness';
      document.querySelectorAll('#quiz-scope-bar .chip').forEach(c => c.classList.remove('active'));
      startQuiz();
    }

    function initDaySelector() {
      const select = document.getElementById('day-select');
      if (!select) return;
      select.innerHTML = '';
      for (let i = 1; i <= PLAN.totalDays; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `DAY ${i}`;
        select.appendChild(opt);
      }
      select.value = currentDay;
    }

    function changeDay(val) {
      currentDay = parseInt(val, 10);
      try { localStorage.setItem('jlpt_current_day', String(currentDay)); localStorage.setItem('jlpt_current_day_date', todayStr()); } catch (e) {}
      const select = document.getElementById('day-select');
      if (select) select.value = currentDay;

      const active = id => document.getElementById(id).classList.contains('active');
      if (active('tab-reading')) renderReading();
      if (active('tab-grammar')) renderGrammarRef();
      if (active('tab-listen') && !audio.playing) { audio.list = []; audio.idx = 0; renderListen(); }
      if (active('tab-quiz') && ['gdrill', 'grammar'].includes(quizScope)) startQuiz();   // DAY에 따라 바뀌는 문제만 다시
      if (active('tab-stats')) renderStatsDashboard();
    }

    function switchTab(tab, btn, skipInit) {
      const prev = document.querySelector('.tab-content.active');
      if (prev && prev.id === 'tab-listen' && tab !== 'listen' && !audio.playing) stopListen();
      if (prev && prev.id === 'tab-vocab' && tab !== 'vocab' && listenPlayingId) stopListen();   // 장면 모범 대화
      if (prev && prev.id === 'tab-quiz' && tab !== 'quiz' && mock) stopSpeech();
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(`tab-${tab}`).classList.add('active');
      const navBtn = btn || document.getElementById(`nav-${tab}`) || (tab === 'stats' ? document.getElementById('nav-today') : null);
      if (navBtn) navBtn.classList.add('active');

      // 모바일 헤더 폭에 맞추어 타이틀 길이 최적화
      const titleMap = {
        today: '오늘의 학습',
        vocab: 'N2 어휘 문제',
        reading: 'N2 독해',
        grammar: 'N2 문법 정리',
        listen: 'N2 청해',
        quiz: '실력 점검 퀴즈',
        stats: '학습 통계/분석'
      };
      document.getElementById('app-title').textContent = titleMap[tab];

      if (skipInit) return;
      if (tab === 'today') renderToday();
      if (tab === 'vocab') renderVocab();
      if (tab === 'reading') renderReading();
      if (tab === 'grammar') renderGrammarRef();
      if (tab === 'listen') renderListen();
      if (tab === 'quiz') {
        if (mock && quizScope === 'mock') { renderMockQuestion(); return; }
        // 풀던 세트가 있으면 이어서 (다른 탭에 다녀와도 처음부터 다시 시작하지 않게)
        if (quizScope !== 'mock' && currentQuizIdx < currentQuizList.length && (currentQuizIdx > 0 || quizAnswered)) {
          document.querySelectorAll('#quiz-scope-bar .chip').forEach(c => c.classList.toggle('active', c.dataset.scope === quizScope));
          if (quizAnswered) nextQuestion(); else renderQuizQuestion();
          return;
        }
        const active = document.querySelector(`#quiz-scope-bar .chip[data-scope="${quizScope}"]`) || document.querySelector('#quiz-scope-bar .chip');
        document.querySelectorAll('#quiz-scope-bar .chip').forEach(c => c.classList.toggle('active', c === active));
        quizScope = active ? active.dataset.scope : 'vocab';
        startQuiz();
      }
      if (tab === 'stats') renderStatsDashboard();
    }

    // 저장 공간이 부족할 때 브라우저가 이 사이트의 기록을 지우지 않도록 요청 (지원하는 브라우저에서만)
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
    saveState();
    applyTheme();
    syncPrefButtons();
    initDaySelector();
    syncVocabModeButtons();
    syncGrefModeButtons();
    renderVocab();
    renderToday();
    // 날짜가 바뀐 뒤 처음 열면 DAY 선택을 오늘 진도(아직 안 끝난 가장 앞 DAY)로 맞춤 — 문법·독해·청해 탭을 바로 눌러도 어제 DAY가 나오지 않게
    try {
      if (localStorage.getItem('jlpt_current_day_date') !== todayStr() && todayPlanCache) {
        const target = Math.min(PLAN.totalDays, Math.max(1, todayPlanCache.progressDay));
        if (target !== currentDay) changeDay(target);
        else localStorage.setItem('jlpt_current_day_date', todayStr());
      }
    } catch (e) {}
    // 앱을 다시 열거나 날짜가 바뀌면 오늘 탭 새로 계산
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && document.getElementById('tab-today').classList.contains('active')) renderToday();
    });
  </script>

</body>
</html>
