  <script>
    // 화면이 그려지기 전에 테마·글자 크기를 적용 (깜빡임 방지). 설정은 기기별로 저장
    (function () {
      var p = {};
      try { p = JSON.parse(localStorage.getItem('jlpt_prefs') || '{}') || {}; } catch (e) {}
      var dark = p.theme === 'dark' || (p.theme !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      var el = document.documentElement;
      if (dark) el.setAttribute('data-theme', 'dark');
      if (p.font && p.font !== 'm') el.setAttribute('data-font', p.font);
    })();
  </script>

  <!-- 일본어 표준 웹폰트 (Noto Serif JP) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200..900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-2: #334155;
      --text-muted: #64748b;
      --heading: #0f172a;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent-red: #ef4444;
      --accent-green: #10b981;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --tag-bg: #f1f5f9;
      --surface-2: #f8fafc;
      --btn-bg: #ffffff;
      --blue-bg: #eef2ff; --blue-bg-2: #e0e7ff; --blue-text: #3730a3; --blue-border: #c7d2fe;
      --sky-bg: #eff6ff; --sky-text: #1e40af; --sky-strong: #0284c7;
      --green-bg: #ecfdf5; --green-bg-2: #d1fae5; --green-text: #065f46; --green-border: #a7f3d0;
      --red-bg: #fef2f2; --red-bg-2: #fee2e2; --red-text: #991b1b;
      --amber-bg: #fffbeb; --amber-bg-2: #fef3c7; --amber-text: #92400e; --amber-border: #fde68a;
      --violet-bg: #f5f3ff; --violet-bg-2: #ede9fe; --violet-text: #5b21b6; --violet-border: #ddd6fe;
      --shadow: rgba(15, 23, 42, 0.04);
      color-scheme: light;
    }
    /* 다크 모드: 설정에서 '어둡게'를 고르거나, '시스템'일 때 기기 설정이 다크면 적용 */
    :root[data-theme="dark"] {
      --bg: #0b1220;
      --card-bg: #111a2e;
      --text: #e2e8f0;
      --text-2: #cbd5e1;
      --text-muted: #94a3b8;
      --heading: #f1f5f9;
      --primary: #4f8ff7;
      --primary-hover: #3b7be8;
      --accent-red: #f87171;
      --accent-green: #34d399;
      --border: #24324a;
      --border-strong: #33445f;
      --tag-bg: #18233a;
      --surface-2: #142036;
      --btn-bg: #16213a;
      --blue-bg: #1b2547; --blue-bg-2: #1f2b55; --blue-text: #a5b4fc; --blue-border: #3b4a7a;
      --sky-bg: #142a4a; --sky-text: #93c5fd; --sky-strong: #7dd3fc;
      --green-bg: #0e2a22; --green-bg-2: #12382c; --green-text: #6ee7b7; --green-border: #1f5f4a;
      --red-bg: #2e1517; --red-bg-2: #3a1a1d; --red-text: #fca5a5;
      --amber-bg: #2b2210; --amber-bg-2: #362a10; --amber-text: #fcd34d; --amber-border: #5c4614;
      --violet-bg: #221a3d; --violet-bg-2: #2a2050; --violet-text: #c4b5fd; --violet-border: #4c3a7a;
      --shadow: rgba(0, 0, 0, 0.3);
      color-scheme: dark;
    }
    /* 글자 크기 (설정) — 화면 대부분이 rem 단위라 함께 커지고 작아짐 */
    html { font-size: 16px; }
    html[data-font="s"] { font-size: 14.5px; }
    html[data-font="l"] { font-size: 17.5px; }
    html[data-font="xl"] { font-size: 19px; }
    * {
      box-sizing: border-box; margin: 0; padding: 0;
      font-family: "Noto Serif JP", "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body { background-color: var(--bg); color: var(--text); padding-bottom: calc(80px + env(safe-area-inset-bottom)); -webkit-tap-highlight-color: transparent; }
    button, input, select { color: inherit; }

    /* Top Header (모바일 가로 찌그러짐 방지 최적화) */
    header {
      position: sticky; top: 0; background: var(--card-bg); border-bottom: 1px solid var(--border);
      padding: calc(8px + env(safe-area-inset-top)) 12px 8px; z-index: 50; display: flex; justify-content: space-between; align-items: center;
      gap: 6px;
    }
    .header-left {
      display: flex; align-items: center; gap: 6px;
      min-width: 0; flex: 1 1 auto; overflow: hidden;
    }
    .header-left h1 {
      font-size: 0.98rem; font-weight: 700; color: var(--primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .header-right {
      display: flex; align-items: center; gap: 6px;
      flex-shrink: 0;
    }
    .day-selector {
      padding: 5px 8px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); font-size: 0.82rem; font-weight: 700; color: var(--text);
      outline: none; cursor: pointer; flex-shrink: 0; white-space: nowrap;
    }

    /* 헤더 전용 컴팩트 버튼 (메인 카드 .btn 속성과 완전 분리) */
    .btn-header {
      padding: 4px 8px;
      font-size: 0.74rem;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--tag-bg);
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-icon { padding: 4px 7px; font-size: 0.9rem; }

    /* 모바일 초소형 화면 (375px 이하) 세부 조율 */
    @media (max-width: 430px) {
      .header-left h1 { display: none; }
    }
    @media (max-width: 380px) {
      header { padding: calc(6px + env(safe-area-inset-top)) 8px 6px; gap: 4px; }
      .header-left h1 { font-size: 0.9rem; }
      .day-selector { padding: 4px 6px; font-size: 0.78rem; }
      .btn-header { padding: 4px 6px; font-size: 0.7rem; }
    }

    main { padding: 16px; max-width: 650px; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Filter & Sprint Bars */
    .filter-bar { display: flex; gap: 6px; margin-bottom: 8px; overflow-x: auto; padding-bottom: 2px; }
    .chip { padding: 5px 12px; border-radius: 20px; font-size: 0.82rem; border: 1px solid var(--border); background: var(--card-bg); cursor: pointer; white-space: nowrap; }
    .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }
    .chip-sm { padding: 4px 10px; border-radius: 16px; font-size: 0.76rem; border: 1px solid var(--border); background: var(--btn-bg); cursor: pointer; white-space: nowrap; color: var(--text-muted); }
    .chip-sm.active { background: var(--blue-bg); color: var(--blue-text); border-color: var(--blue-border); font-weight: 700; }


    /* Blind Controls */
    .blind-controls { display: flex; gap: 8px; margin-bottom: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    .blind-controls .group { display: flex; gap: 6px; }
    .btn-toggle-blind { font-size: 0.76rem; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--btn-bg); color: var(--text-muted); cursor: pointer; }
    .btn-toggle-blind.active { background: var(--border); color: var(--heading); font-weight: 700; }

    /* Single Card */
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 20px; box-shadow: 0 2px 8px var(--shadow); min-height: 380px; display: flex; flex-direction: column; justify-content: space-between; }
    .more-details { margin-top: 4px; }
    .more-details > summary { cursor: pointer; font-size: 0.82rem; color: var(--primary); font-weight: 600; padding: 6px 0; list-style: none; }
    .more-details > summary::-webkit-details-marker { display: none; }
    .more-details[open] > summary { margin-bottom: 6px; }

    .blur-mask { filter: blur(7px); user-select: none; transition: filter 0.15s ease; cursor: pointer; }
    .blur-mask:active, .blur-mask.reveal { filter: none; }

    /* 목록 보기 (이동 중 눈으로 훑기) */
    .word-list-row { display: flex; align-items: center; gap: 10px; padding: 11px 12px 11px 8px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 6px; cursor: pointer; }
    .word-list-row.is-memorized { border-left: 4px solid var(--accent-green); }
    .word-list-row.is-confused { border-left: 4px solid var(--accent-red); }
    .wl-num { flex: 0 0 var(--wl-num-w, 2ch); font-size: 0.74rem; color: var(--text-muted); text-align: right; font-variant-numeric: tabular-nums; }
    .wl-main { flex: 1; min-width: 0; }
    .wl-word { font-size: 1.12rem; font-weight: 800; color: var(--heading); margin-right: 5px; }
    .wl-kana { display: inline-block; font-size: 0.74rem; color: var(--primary); }
    .wl-mean { font-size: 0.88rem; color: var(--text-2); margin-top: 2px; }
    .wl-day { display: inline-block; font-size: 0.62rem; color: var(--text-muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 3px; margin-left: 5px; vertical-align: 2px; font-weight: 600; }

    /* 장면·기능 색인 */
    .scene-tabs { margin-bottom: 10px; }
    .scene-domain { font-size: 0.86rem; font-weight: 800; color: var(--heading); margin: 16px 0 8px; }
    .scene-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .scene-card { text-align: left; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; cursor: pointer; color: var(--text); font: inherit; min-width: 0; }
    .scene-card:active { transform: scale(0.98); }
    .sc-role { font-size: 0.7rem; color: var(--text-muted); }
    .sc-title { font-size: 0.9rem; font-weight: 800; color: var(--heading); margin-top: 2px; line-height: 1.35; }
    .sc-ja { font-size: 0.76rem; color: var(--primary); margin-top: 2px; line-height: 1.4; }
    .sc-bar { height: 5px; background: var(--border); border-radius: 3px; margin-top: 8px; overflow: hidden; }
    .sc-bar span { display: block; height: 100%; background: var(--accent-green); }
    .sc-meta { font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; }
    .scene-head { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
    .scene-title { font-size: 1.12rem; font-weight: 800; color: var(--heading); margin-top: 2px; }
    .scene-head .sc-ja { font-size: 0.9rem; display: flex; align-items: center; gap: 6px; }
    .scene-tts { flex: 0 0 28px; height: 26px; }
    .scene-flow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 10px; font-size: 0.76rem; }
    .scene-flow-step { background: var(--tag-bg); color: var(--text-2); border-radius: 6px; padding: 2px 7px; }
    .scene-flow-arrow { color: var(--text-muted); }
    .scene-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; }
    .scene-note { font-size: 0.72rem; color: var(--text-muted); margin-top: 8px; line-height: 1.5; }
    .scene-step-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 0.86rem; font-weight: 800; color: var(--heading); margin: 14px 2px 6px; }
    .scene-step-head .cnt { font-size: 0.72rem; font-weight: normal; color: var(--text-muted); text-align: right; }
    .scene-extra { cursor: default; background: var(--surface-2); padding-left: 12px; }
    .exam-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .exam-title { font-size: 1.1rem; font-weight: 800; color: var(--heading); margin-bottom: 4px; }
    .exam-sec { font-size: 0.86rem; font-weight: 800; color: var(--heading); margin: 14px 0 6px; }
    .exam-tips { margin: 0; padding-left: 18px; font-size: 0.84rem; line-height: 1.65; color: var(--text-2); }
    .exam-note { font-size: 0.8rem; color: var(--text-muted); margin-top: 12px; line-height: 1.6; }
    .exam-stats { margin-top: 10px; }
    .scene-dialog { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
    .scene-dialog > summary { cursor: pointer; font-size: 0.9rem; font-weight: 800; color: var(--heading); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .scene-dialog > summary .cnt { font-size: 0.74rem; font-weight: normal; color: var(--text-muted); }
    .scene-dialog-tip { font-size: 0.76rem; color: var(--text-muted); margin: 8px 0; line-height: 1.5; }
    .scene-dialog .listen-card { margin: 0; border: none; padding: 0; box-shadow: none; }
    .scene-dialog .dlg-goto { display: none; }
    .dlg-w { color: var(--primary); font-weight: 800; }
    .dlg-words { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border); }
    .dlg-words-title { font-size: 0.78rem; font-weight: 700; color: var(--text-2); margin-bottom: 6px; }
    .dlg-chip { display: inline-flex; flex-direction: column; background: var(--tag-bg); border-radius: 8px; padding: 4px 8px; margin: 0 4px 6px 0; font-size: 0.86rem; font-weight: 700; color: var(--heading); cursor: pointer; }
    .dlg-chip small { font-size: 0.68rem; font-weight: normal; color: var(--text-muted); }
    .dlg-goto { margin-top: 4px; }

    /* 모드 전환 · 학습 계획 */
    .mode-toggle { display: flex; background: var(--border); border-radius: 10px; padding: 3px; margin-bottom: 10px; }
    .mode-btn { flex: 1; border: none; background: transparent; padding: 7px 6px; border-radius: 8px; font-size: 0.84rem; font-weight: 600; color: var(--text-muted); cursor: pointer; }
    .mode-btn.active { background: var(--card-bg); color: var(--primary); box-shadow: 0 1px 3px var(--shadow); }
    .plan-row { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 0.85rem; line-height: 1.5; }
    .plan-row:last-child { border-bottom: none; }
    .plan-days { flex: 0 0 auto; font-weight: 700; color: var(--primary); min-width: 92px; }
    .plan-row.now { background: var(--sky-bg); border-radius: 8px; padding: 8px; }

    /* Example Boxes */
    .example-box { background: var(--tag-bg); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; font-size: 0.92rem; line-height: 1.5; }
    .example-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .example-ko { color: var(--text-muted); font-size: 0.84rem; margin-top: 5px; display: block; }

    /* 안내 띠 */
    .review-banner { background: var(--green-bg); border: 1px solid var(--accent-green); color: var(--green-text); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-size: 0.88rem; font-weight: 600; text-align: center; }
    .info-banner { background: var(--sky-bg); border: 1px solid var(--blue-border); color: var(--sky-text); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-size: 0.84rem; line-height: 1.55; }
    .warn-banner { background: var(--amber-bg); border: 1px solid var(--amber-border); color: var(--amber-text); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-size: 0.84rem; line-height: 1.55; }
    .empty-box { text-align: center; padding: 50px 16px; color: var(--text-muted); background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); line-height: 1.7; font-size: 0.9rem; }

    /* Main Card Action Buttons */
    .btn-row { display: flex; gap: 8px; margin-top: 14px; }
    .btn { flex: 1; padding: 11px; border-radius: 8px; border: none; font-size: 0.92rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: 0.2s; }
    .btn-sm { flex: 0 0 auto; padding: 5px 10px; font-size: 0.78rem; border-radius: 6px; }
    .btn-tts-sm { flex: 0 0 30px; height: 26px; padding: 0; font-size: 0.75rem; border-radius: 6px; border: 1px solid var(--border); background: var(--btn-bg); cursor: pointer; }
    .btn-tts-lg { background: var(--blue-bg-2); color: var(--blue-text); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; border: 1px solid var(--blue-border); cursor: pointer; }
    .btn-review { background: var(--red-bg-2); color: var(--accent-red); }
    .btn-review.active { background: var(--accent-red); color: #fff; }
    .btn-memorized { background: var(--green-bg-2); color: var(--green-text); }
    .btn-memorized.active { background: var(--accent-green); color: #fff; }
    .btn-row .btn { padding: 11px 6px; font-size: 0.88rem; }
    .wl-btn { flex: 0 0 32px; height: 30px; border-radius: 7px; border: 1px solid var(--border); background: var(--btn-bg); font-size: 0.8rem; cursor: pointer; padding: 0; }
    .btn-plain { background: var(--tag-bg); border: 1px solid var(--border); color: var(--text-2); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-soft { background: var(--blue-bg-2); color: var(--blue-text); }
    .btn-danger-soft { background: var(--red-bg-2); color: var(--red-text); }


    /* Reading Card */
    .reading-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 24px; box-shadow: 0 1px 3px var(--shadow); }
    .reading-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 6px; flex-wrap: wrap; }
    .badge { font-size: 0.78rem; padding: 4px 10px; border-radius: 6px; font-weight: 700; }
    .badge-long { background: var(--red-bg-2); color: var(--red-text); }
    .badge-short { background: var(--green-bg); color: var(--green-text); }
    .badge-mid { background: var(--sky-bg); color: var(--sky-text); }
    .badge-extra { background: var(--amber-bg-2); color: var(--amber-text); }
    .badge-adv { background: var(--violet-bg-2); color: var(--violet-text); }
    .reading-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 14px; line-height: 1.4; color: var(--heading); }
    .char-count { font-size: 0.8rem; color: var(--text-muted); font-weight: normal; margin-left: 6px; }
    .reading-text { font-size: 1rem; line-height: 1.9; margin-bottom: 18px; color: var(--heading); text-align: justify; word-break: break-all; }
    .reading-text p { margin-bottom: 14px; text-indent: 1em; }
    .reading-text.plain { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; text-align: left; }
    .reading-text.plain p { text-indent: 0; margin-bottom: 6px; }
    .reading-trans { display: none; background: var(--surface-2); border-left: 4px solid var(--primary); padding: 14px 16px; margin-bottom: 16px; font-size: 0.92rem; color: var(--text-2); line-height: 1.8; }
    .reading-trans p { margin-bottom: 10px; }
    .grammar-note { background: var(--surface-2); border-radius: 8px; padding: 14px; font-size: 0.88rem; border: 1px solid var(--border-strong); }
    .grammar-title { font-weight: 700; color: var(--primary); margin-bottom: 8px; display: flex; align-items: center; gap: 4px; }
    .grammar-list { padding-left: 18px; line-height: 1.7; color: var(--text-2); }
    .grammar-list li { margin-bottom: 6px; }
    .btn-read-check { font-size: 0.82rem; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-2); cursor: pointer; font-weight: 600; }
    .btn-read-check.active { background: var(--green-bg-2); color: var(--green-text); border-color: var(--accent-green); }

    /* Dashboard & Analytics */

    /* Grammar Reference */

    .gref-mean { font-size: 0.98rem; font-weight: 700; color: var(--text-2); margin-bottom: 8px; }

    .btn-gref-check.active { background: var(--accent-green); color: #fff; border-color: var(--accent-green); }
    /* 전체 문형 목록: 기능별로 묶은 한 줄 목록 → 누르면 그 자리에서 자세히 */
    .gl-cat { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 0.9rem; font-weight: 800; color: var(--heading); margin: 16px 2px 6px; }
    .gl-cat:first-child { margin-top: 4px; }
    .gl-cat .cnt { font-size: 0.72rem; font-weight: normal; color: var(--text-muted); white-space: nowrap; }
    .gl-row { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 6px; }

    .gl-main { flex: 1; min-width: 0; }
    .gl-p { font-size: 1rem; font-weight: 800; color: var(--heading); }
    .gl-m { font-size: 0.82rem; color: var(--text-2); margin-top: 1px; line-height: 1.45; }

    .gl-arrow { flex: 0 0 auto; color: var(--text-muted); font-size: 0.8rem; transition: transform 0.15s; }

    #btn-gref-blind { margin-left: auto; }
    .drill-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--blue-bg); border: 1px solid var(--blue-border); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; font-size: 0.86rem; color: var(--blue-text); line-height: 1.5; }

    /* 오늘 탭 */

    .tag-extra { background: var(--amber-bg-2); color: var(--amber-text); }
    .task-divider { padding: 8px 14px; font-size: 0.76rem; font-weight: 700; color: var(--text-muted); background: var(--tag-bg); border-bottom: 1px solid var(--border); }
    /* 기록 백업 상자 (오늘 탭·설정) */

    .backup-card.warn { background: var(--amber-bg); border-color: var(--amber-border); }
    .backup-card.error { border-color: var(--accent-red); }
    .bk-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 800; color: var(--heading); font-size: 0.92rem; }

    /* 청해 · 듣기 모드 */

    .listen-status.ng { color: var(--accent-red); }
    .listen-controls { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }

    .listen-opt.wrong { background: var(--red-bg-2); border-color: var(--accent-red); color: var(--red-text); }

    .speaking-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-red); margin-right: 6px; animation: pulse 1s infinite; }

    .audio-stage { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 22px 18px; text-align: center; margin-bottom: 12px; }
    .audio-word { font-size: 2.2rem; font-weight: 900; color: var(--heading); margin: 6px 0; }

    .audio-mean { font-size: 1.15rem; font-weight: 700; color: var(--text-2); margin: 8px 0; }
    .audio-ex { font-size: 0.92rem; color: var(--text-2); line-height: 1.6; margin-top: 8px; }
    .audio-progress { font-size: 0.8rem; color: var(--text-muted); }

    .audio-btns .btn { flex: 0 0 auto; min-width: 54px; font-size: 1.1rem; padding: 12px; }
    .opt-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 0.86rem; }
    .opt-row:last-child { border-bottom: none; }
    .opt-row select { padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--card-bg); font-size: 0.82rem; }

    /* 설정 시트 */
    .sheet-backdrop { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.45); z-index: 90; display: none; }
    .sheet-backdrop.open { display: block; }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 91; background: var(--card-bg); border-radius: 16px 16px 0 0; padding: 16px 18px calc(20px + env(safe-area-inset-bottom)); max-width: 650px; margin: 0 auto; transform: translateY(105%); transition: transform 0.2s ease, visibility 0.2s; max-height: 85vh; overflow-y: auto; visibility: hidden; }

    .seg button.active { background: var(--card-bg); color: var(--primary); font-weight: 700; box-shadow: 0 1px 2px var(--shadow); }

    nav { position: fixed; bottom: 0; left: 0; right: 0; height: calc(60px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--card-bg); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 50; }
    .nav-btn { background: none; border: none; font-size: 0.72rem; color: var(--text-muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; min-width: 0; }
    .nav-btn.active { color: var(--primary); font-weight: 700; }
    .nav-icon { font-size: 1.2rem; }
  </style>
</head>
<body>

  <!-- Top App Bar -->
  <header>
    <div class="header-left">
      <h1 id="app-title">오늘의 학습</h1>
    </div>

    <div class="header-right">
      <select id="day-select" class="day-selector" onchange="changeDay(this.value)"></select>
      <button class="btn-header btn-icon" onclick="openSettings()" aria-label="기록 백업">💾</button>
      <button class="btn-header btn-icon" onclick="openSettings()" aria-label="화면 설정">⚙️</button>
    </div>
  </header>

  <main>
    <!-- TAB 0: 오늘 (진도대로 이어서 할 일) -->
    <section id="tab-today" class="tab-content active">
      <div class="today-head">
        <div class="row1"><span id="today-date" class="date"></span><span id="today-dday" class="dday"></span></div>
        <div id="today-sub" class="sub"></div>
        <div class="today-bar"><div id="today-bar-fill" style="width:0%"></div></div>
        <div id="today-progress" class="sub"></div>
      </div>
      <div id="today-phase"></div>
      <button id="btn-next-task" class="btn-next-task" onclick="goNextTask()"></button>
      <div id="task-list" class="task-list"></div>
      <div id="backup-today"></div>
      <div class="quick-links">

  <!-- 메인 스크립트 -->
  <script>
    // ===== 학습 플랜 설정 (여기만 바꾸면 전체 화면에 반영) =====
    const PLAN = {
      totalDays: 36,                      // DAY 개수 (새 문형·문법 문제·지문·청해가 나오는 마지막 DAY)
      // 단어는 실물 N2 단어장으로 따로 외우고(11/16까지), 앱의 DAY는 문법·독해·청해만 — 날짜별 계획량 없이 끝낸 만큼 다음 DAY로
      // 11/17부터는 앱의 단어로 '어휘 문제'(시험 6유형) 복습
      startDate: '2026-10-26',            // DAY 1을 시작한 날 (시험 후 '며칠 동안 준비했는지' 표시용)
      examDate: '2026-12-06',             // 시험일 (2026년 제2회 JLPT)
      // 본시험형 모의고사를 볼 날 (그날 '오늘' 탭에 나옴. 사흘 안에 미리 봤으면 빠짐, 다른 날은 모의고사 메뉴에서 언제든)
      realMockDays: ['2026-11-09', '2026-11-16', '2026-11-30'],
      phases: [                           // 구간 안내 (통계 탭 표시용)
        { from: 1, to: 22, label: '문법·독해·청해 기본기', note: 'DAY당 문형 4~5개 + 문법 형식·문장 배열 문제 · 단문·중문 위주 독해(장문·통합·정보검색 섞어서) · 즉시응답 중심 청해' },
        { from: 23, to: 36, label: '글의 문법 · 통합이해까지', note: 'DAY 23부터 글의 문법(文章の文法) · DAY 33부터 통합이해 청해 — 본시험 전 유형을 한 번씩' }
      ],
      // ----- 어휘 문제 (어휘 탭) -----
      // 실전 세트 = 시험 언어지식의 어휘 문제 수·순서 그대로 (漢字読み 5 · 表記 5 · 語形成 3 · 文脈規定 7 · 言い換え類義 5 · 用法 5 = 30문항)
      vocabSet: { kanji: 5, hyouki: 5, gokei: 3, context: 7, syn: 5, usage: 5 },
      vocabTypeSize: 20,                  // 유형별 연습 문항 수
      vocabWrongSize: 30,                 // '틀린 어휘 다시' 한 번에 낼 최대 문항 수
      // 틀린 단어: 다음 날 → 맞힐 때마다 3일 → 7일 → 14일 뒤 다시 → 그다음도 맞히면 졸업 (틀리면 처음부터)
      vocabIntervals: [1, 3, 7, 14],
      vocabFrom: '2026-11-17',            // '오늘' 탭에 어휘 실전 세트가 나오기 시작하는 날 (단어장을 끝낸 다음 날)
      vocabSetsPerDay: 2,                 // 하루 어휘 실전 세트 수 (더 풀고 싶으면 어휘 탭에서)
      events: {                           // 특별한 날의 안내 문구
        '2026-12-05': { note: '시험 전날 — 새 공부 없이 틀린 어휘·약점 확인·청해 귀 풀기만 짧게. 준비물을 챙기고 일찍 자기' }
      },
      // 독해 실전 목표 시간 (분) — 시험장 속도 기준
      readingTarget: { short: 2.5, mid: 5, long: 10, integrated: 6, info: 6, advanced: 10 },
      grammarReviewSize: 5                // 'DAY 문법 문제'에 섞어 낼 이전 DAY 복습 문항 수
    };

    const READING_TYPE_LABEL = {
      short: '단문 (短文·200자형)',
      mid: '중문 (中文·500자형)',
      long: '장문 (長文·900자형)',
      integrated: '통합이해 (統合理解)',
      info: '정보검색 (情報検索)',
      advanced: '심화 칼럼 (N1 수준)'
    };
    const READING_TYPE_BADGE = { short: 'badge-short', mid: 'badge-mid', long: 'badge-long', integrated: 'badge-extra', info: 'badge-extra', advanced: 'badge-adv' };

    const VOCAB = (typeof VOCAB_DATA !== 'undefined') ? VOCAB_DATA : [];
    const READINGS = (typeof READING_DATA !== 'undefined') ? READING_DATA : [];
    const GRAMMAR_QUIZ = (typeof GRAMMAR_QUIZ_DATA !== 'undefined') ? GRAMMAR_QUIZ_DATA : [];
    const GREF = (typeof GRAMMAR_REF !== 'undefined') ? GRAMMAR_REF : [];
    const GREF_CATS = (typeof GRAMMAR_REF_CATS !== 'undefined') ? GRAMMAR_REF_CATS : [];
    const GFILL = (typeof GRAMMAR_FILL !== 'undefined') ? GRAMMAR_FILL : [];
    const GORDER = (typeof GRAMMAR_ORDER !== 'undefined') ? GRAMMAR_ORDER : [];
    const LISTEN = (typeof LISTENING_DATA !== 'undefined') ? LISTENING_DATA : [];
    const vocabById = new Map(VOCAB.map(w => [w.id, w]));
    const curriculumIds = new Set(VOCAB.map(w => w.id));
    const grefById = new Map(GREF.map(g => [g.id, g]));
    const readingById = new Map(READINGS.map(r => [r.id, r]));
    const listenById = new Map(LISTEN.map(x => [x.id, x]));
    // N2 문형 146개를 DAY 1~36에 순서대로 4~5개씩 배정 (같은 기능끼리 묶여 있어 비교하며 외우기 좋음)
    const grammarDayOf = new Map(GREF.map((g, i) => [g.id, Math.floor(i * PLAN.totalDays / GREF.length) + 1]));
    const GPASS = (typeof GRAMMAR_PASSAGE !== 'undefined') ? GRAMMAR_PASSAGE : [];
    const USAGE = (typeof USAGE_DATA !== 'undefined') ? USAGE_DATA : [];
    // 文章の文法: 세트의 빈칸 하나하나를 문제 하나로 ('p01-1' 등) — 결과는 다른 문법 문제처럼 'd:' 기록
    const PASSAGE_ITEMS = GPASS.flatMap(ps => ps.q.map((q, i) => ({ id: `${ps.id}-${i + 1}`, day: ps.day, ps, bi: i })));
    const drillDay = d => d.day || grammarDayOf.get(d.g) || 1;
    const ALL_DRILLS = [...GFILL, ...GORDER, ...PASSAGE_ITEMS];
    // 用法: 앱 단어의 같은 단어와 연결 (어휘 문제·모의고사의 用法으로 출제)
    const vocabByWord = new Map(VOCAB.map(w => [w.word, w]));
    USAGE.forEach(u => { const w = vocabByWord.get(u.w); if (w) { u.wordId = w.id; u.day = w.day; } });
    // 장면·기능 색인: 색인에 적힌 표기를 앱 단어(vocab-data.js)로 연결
    const SCENE_DOMS = (typeof SCENE_DOMAINS !== 'undefined') ? SCENE_DOMAINS : [];
    const SCENES = ((typeof SCENE_DATA !== 'undefined') ? SCENE_DATA : []).map(sc => ({ ...sc,
      steps: sc.steps.map(([label, list]) => ({ label, words: list.trim().split(/\s+/).map(x => vocabByWord.get(x)).filter(Boolean) })) }));
    const sceneById = new Map(SCENES.map(sc => [sc.id, sc]));
    // 장면 모범 대화(2단계): 청해 문제와 같은 형식(id 'sd-장면id')으로 바꿔 청해의 재생·채점·스크립트 기능을 그대로 사용
    // 대사의 {표기} / {활용형|사전형}은 장면 단어로 강조하고, 스크립트 아래에 그 단어들을 모아 보여 줌
    const DLG_MARK = /{([^{}|]+)(?:\|([^{}]+))?}/g;
    const SCENE_LISTEN = SCENES.filter(sc => typeof SCENE_DIALOGS !== 'undefined' && SCENE_DIALOGS[sc.id]).map(sc => {
      const dl = SCENE_DIALOGS[sc.id];
      const meanOf = lemma => { const w = vocabByWord.get(lemma); if (w) return w.mean; const e = (sc.extra || []).find(x => x[0] === lemma); return e ? e[2] : ''; };
      const used = [];
      const lines = dl.lines.map(([who, ja, ko]) => [who, ja.replace(DLG_MARK, '$1'), ko,
        ja.replace(DLG_MARK, (m, surface, lemma) => { lemma = lemma || surface; if (!used.includes(lemma)) used.push(lemma); return `<b class="dlg-w" title="${escapeHtml(meanOf(lemma))}">${surface}</b>`; })]);
      const chips = used.map(lemma => { const w = vocabByWord.get(lemma); return `<span class="dlg-chip" data-tts="${escapeHtml(lemma)}">${lemma}<small>${escapeHtml(meanOf(lemma))}${w ? ` · ${w.level}` : ' · 장면 표현'}</small></span>`; }).join('');
      return { id: `sd-${sc.id}`, sceneId: sc.id, type: dl.type, label: sc.title, intro: dl.intro, introKo: dl.introKo, lines, qs: dl.qs,
        scriptExtra: `<div class="dlg-words"><div class="dlg-words-title">🗺️ 이 대화의 장면 단어 (누르면 발음)</div>${chips}<button class="btn btn-sm btn-plain dlg-goto" onclick="goScene('${sc.id}')">이 장면 단어 모두 보기 →</button></div>` };
    });
    SCENE_LISTEN.forEach(x => listenById.set(x.id, x));
    const sceneListenOf = new Map(SCENE_LISTEN.map(x => [x.sceneId, x]));
    // '오늘의 장면' 순서: 영역을 번갈아 가며 (직장 → 학교 → 가게 → 관공서 → 생활 → 건강 → 사회 → 직장 …)
    const SCENE_ROTATION = (() => {
      const groups = SCENE_DOMS.filter(d => d.id !== 'func').map(d => SCENES.filter(sc => sc.d === d.id && sceneListenOf.has(sc.id)));
      const out = [];
      for (let i = 0; groups.some(g => i < g.length); i++) groups.forEach(g => { if (g[i]) out.push(g[i]); });
      return out;
    })();
    const USAGE_LINKED = USAGE.filter(u => u.wordId);

    // ===== 유틸 =====
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    function addDays(dateStr, n) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d + n);
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    }
    function hasKanji(str) { return /[一-鿿々]/.test(str || ''); }
    // 히라가나만 또는 가타카나만으로 쓴 말(いきなり, アイデア 등)은 읽기가 표기와 같으므로 장면 목록·해설·오답노트·몰아듣기에 따로 보여 주지 않음
    function shownReading(w) {
      const s = (w.word || '').replace(/[〜～()（）\s]/g, '');
      return /^[ぁ-ゟー]+$/.test(s) || /^[゠-ヿ]+$/.test(s) ? '' : (w.kana || '');
    }
    function bracketReading(w) { const r = shownReading(w); return r ? `【${r}】` : ''; }
    function wrongReading(w) { const r = shownReading(w); return r ? ` <span style="font-size:0.82rem; color:var(--primary); font-weight:normal;">[${r}]</span>` : ''; }
    function posGroup(w) { return (w.pos || '').split(/[\s(/]/)[0]; }
    function charLength(item) { return item.paragraphs.join('').replace(/\s/g, '').length; }
    // ===== 상태 저장 =====
    let currentDay = 1;       // 헤더의 DAY 선택 (문법·독해·청해 탭) — 저장된 값, 날짜가 바뀌면 이어서 할 DAY로
    let vocabMode = 'q';      // 'q' = 어휘 문제 / 'scene' = 장면·기능 색인
    try { if (localStorage.getItem('jlpt_vocab_mode') === 'scene') vocabMode = 'scene'; } catch (e) {}
    let vocabLevel = 'all';   // 어휘 문제 출제 범위: all | N3 | N2 | N1
    try { const lv = localStorage.getItem('jlpt_vocab_level'); if (['N3', 'N2', 'N1'].includes(lv)) vocabLevel = lv; } catch (e) {}
    // 장면 색인: 연 장면 id / 목록 탭(장면·기능)
    let sceneSel = '', sceneTab = 'scene', sceneDlgOpen = false;
    try { sceneSel = localStorage.getItem('jlpt_scene') || ''; sceneTab = localStorage.getItem('jlpt_scene_tab') || 'scene'; } catch (e) {}
    let readingFilter = 'short';
    let blindSettings = { mean: false, reading: false };

    let studyState = {};
    try { studyState = JSON.parse(localStorage.getItem('jlpt_study_state') || '{}') || {}; } catch (e) { studyState = {}; }
    if (!Array.isArray(studyState.memorized)) studyState.memorized = [];
    if (!Array.isArray(studyState.confused)) studyState.confused = [];
    if (!studyState.quizWrongCount) studyState.quizWrongCount = {};
    if (!Array.isArray(studyState.readCompleted)) studyState.readCompleted = [];
    if (!Array.isArray(studyState.grammarDone)) studyState.grammarDone = [];
    if (!studyState.srs) studyState.srs = {};   // 예전 단어장(외웠음·헷갈림·복습 일정) 기록 — 지금은 쓰지 않지만 지우지 않고 보관
    ensureStamps(studyState);
    try {
      const savedDay = parseInt(localStorage.getItem('jlpt_current_day'), 10);
      if (savedDay >= 1 && savedDay <= PLAN.totalDays) currentDay = savedDay;
    } catch (e) {}

    // ===== 변경 시각 기록 (stamps) =====
    // 키: 'w:단어id' → 'm'(외움)·'c'(헷갈림)·''(해제) — 예전 단어장 기록 (보관만) / 'r:지문id', 'g:문형id' → 1·0
    //     'a:지문id-문항' → 'o'·'x' (독해 문제 결과)   'e:지문id' → 초 (독해 풀이 시간)
    //     'd:문제id' → 'o'·'x' (문법 형식·문장 배열)   'l:청해id-문항' → 'o'·'x' (청해)
    //     't:날짜-할일' → 1·0 (틀린 문제 다시·귀 풀기 등 완료 체크), 't:날짜-vset' → 그날 끝낸 어휘 세트 수
    //     'h:날짜'·'o:날짜' → 예전 시간 모드·근무표 기록 (지금은 쓰지 않음, 보관만)
    //     'x:시각' → 모의고사 기록   'v:단어id' → 어휘 문제 기록 { b, d, r, k, n } (vocabRecord 참고)
    // 여러 기기를 오갈 때 '해제'도 포함해 가장 최근에 바꾼 쪽이 이기도록 병합에 사용
    // (종류는 꼭 한 글자 — rebuildFromStamps가 key.slice(0,1)로 구분)
    function ensureStamps(state) {
      if (!state.stamps || typeof state.stamps !== 'object') state.stamps = {};
      const put = (key, v) => { if (!state.stamps[key]) state.stamps[key] = { v, t: 0 }; };
      (state.memorized || []).forEach(id => put('w:' + id, 'm'));
      (state.confused || []).forEach(id => put('w:' + id, 'c'));
      (state.readCompleted || []).forEach(id => put('r:' + id, 1));
      (state.grammarDone || []).forEach(id => put('g:' + id, 1));
    }
    function rebuildFromStamps() {
      const mem = [], conf = [], read = [], gram = [];
      Object.keys(studyState.stamps).forEach(key => {
        const v = studyState.stamps[key].v;
        const kind = key.slice(0, 1), id = key.slice(2);
        if (kind === 'w' && v === 'm') mem.push(Number(id));
        else if (kind === 'w' && v === 'c') conf.push(Number(id));
        else if (kind === 'r' && v === 1) read.push(Number(id));
        else if (kind === 'g' && v === 1) gram.push(id);
      });
      studyState.memorized = mem;
      studyState.confused = conf;
      studyState.readCompleted = read;
      studyState.grammarDone = gram;
    }
    function setFlag(kind, id, on) {
      const field = kind === 'r' ? 'readCompleted' : 'grammarDone';
      studyState[field] = studyState[field].filter(x => x !== id);
      if (on) studyState[field].push(id);
      studyState.stamps[kind + ':' + id] = { v: on ? 1 : 0, t: Date.now() };
    }
    function stampV(key) { const s = studyState.stamps[key]; return s ? s.v : undefined; }
    function stampT(key) { const s = studyState.stamps[key]; return s ? (s.t || 0) : 0; }
    function setStamp(key, v) { studyState.stamps[key] = { v, t: Date.now() }; }
    function startOfToday() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime(); }
    // 문제 결과 기록 ('o'·'x'). 같은 문제를 다시 풀면 마지막 결과로 덮어씀
    function recordResult(key, ok) { setStamp(key, ok ? 'o' : 'x'); }

    // ===== 화면·소리 설정 (기기별, 백업 파일에 넣지 않음) =====
    let prefs = { theme: 'system', font: 'm', ttsRate: 0.95 };
    try { prefs = { ...prefs, ...(JSON.parse(localStorage.getItem('jlpt_prefs') || '{}') || {}) }; } catch (e) {}
    function savePrefs() { try { localStorage.setItem('jlpt_prefs', JSON.stringify(prefs)); } catch (e) {} }
    function applyTheme() {
      const dark = prefs.theme === 'dark' || (prefs.theme === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.toggleAttribute('data-theme', false);
      if (dark) document.documentElement.setAttribute('data-theme', 'dark');
      if (prefs.font && prefs.font !== 'm') document.documentElement.setAttribute('data-font', prefs.font);
      else document.documentElement.removeAttribute('data-font');
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', dark ? '#111a2e' : '#2563eb');
    }
    if (window.matchMedia) {
      const mq = matchMedia('(prefers-color-scheme: dark)');
      const onChange = () => { if (prefs.theme === 'system') applyTheme(); };
      if (mq.addEventListener) mq.addEventListener('change', onChange); else if (mq.addListener) mq.addListener(onChange);
    }
    function syncPrefButtons() {
      document.querySelectorAll('[data-pref]').forEach(seg => {
        const key = seg.getAttribute('data-pref');
        seg.querySelectorAll('button').forEach(b => b.classList.toggle('active', String(prefs[key]) === b.getAttribute('data-v')));
      });
    }
    function setPref(key, value) {
      prefs[key] = value;
      savePrefs();
      applyTheme();
      syncPrefButtons();
    }
    function openSettings() {
      syncPrefButtons();
      document.getElementById('sheet-backdrop').classList.add('open');
      document.getElementById('settings-sheet').classList.add('open');
      describeVoices();
      renderBackupCard();
    }
    function closeSettings() {
      document.getElementById('sheet-backdrop').classList.remove('open');
      document.getElementById('settings-sheet').classList.remove('open');
    }
    // ===== 기록 백업 =====
    // 기록은 이 기기의 브라우저(localStorage)에만 저장됨 → 브라우저 데이터 삭제·기기 변경에 대비해 파일로 내보내 두고,
    // 다른 기기에서는 불러오기로 합침 (같은 항목은 더 최근에 바꾼 쪽이 남음)
    let storageError = '';   // 이 기기에 저장하지 못했을 때의 오류 (백업 안내에 빨갛게 표시)
    const SHARE_OK = (() => { try { return !!(navigator.canShare && navigator.canShare({ files: [new File(['{}'], 'jlpt.json', { type: 'application/json' })] })); } catch (e) { return false; } })();
    function lastBackupAt() { try { return Number(localStorage.getItem('jlpt_last_backup')) || 0; } catch (e) { return 0; } }
    function backupJson() { return JSON.stringify({ app: 'jlpt-study', version: 2, exportedAt: new Date().toISOString(), state: studyState }); }
    function backupName() { const n = new Date(); return `jlpt-backup-${todayStr()}-${String(n.getHours()).padStart(2, '0')}${String(n.getMinutes()).padStart(2, '0')}.json`; }
    function markBackedUp() {
      try { localStorage.setItem('jlpt_last_backup', String(Date.now())); } catch (e) {}
      renderBackupCard();
    }
    function exportBackup() {
      const blob = new Blob([backupJson()], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = backupName();
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      markBackedUp();
    }
    // 휴대폰 공유 시트로 보내기 (카카오톡 나에게·Google Drive·파일 앱 등) — 지원하는 기기에서만 버튼이 보임
    async function shareBackup() {
      const file = new File([backupJson()], backupName(), { type: 'application/json' });
      try { await navigator.share({ files: [file], title: 'JLPT 공부 기록 백업' }); markBackedUp(); }
      catch (e) { if (!e || e.name !== 'AbortError') alert('보내기에 실패했습니다. [파일로 저장]을 써 주세요.'); }
    }
    function backupWhen(t) {
      if (!t) return '';
      const d = new Date(t), days = Math.round((startOfToday() - new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime()) / 86400000);
      const hm = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
      return days <= 0 ? `오늘 ${hm}` : days === 1 ? `어제 ${hm}` : `${days}일 전 (${d.getMonth() + 1}/${d.getDate()})`;
    }
    // 오늘 탭·설정에 같은 백업 상자를 보여 줌 (이틀 넘게 백업하지 않았으면 노란색으로 알림)
    function backupCardHtml() {
      const t = lastBackupAt(), has = Object.keys(studyState.stamps).length > 0;
      const days = t ? Math.round((startOfToday() - new Date(new Date(t).toDateString()).getTime()) / 86400000) : 99;
      const warn = storageError || (has && days >= 2);
      return `<div class="backup-card ${storageError ? 'error' : warn ? 'warn' : ''}">
          <div class="bk-title"><span>💾 내 기록 백업</span><span class="bk-when">${t ? `마지막 백업: ${backupWhen(t)}` : '아직 백업한 적 없음'}</span></div>
          ${storageError ? `<div class="bk-note" style="color:var(--accent-red); font-weight:700;">⚠ 이 기기에 기록을 저장하지 못했습니다 (${escapeHtml(storageError)}). 지금 파일로 저장해 두세요.</div>` : ''}
          <div class="bk-btns">
            <button class="btn btn-sm btn-primary" onclick="exportBackup()">📥 파일로 저장</button>
            ${SHARE_OK ? '<button class="btn btn-sm btn-soft" onclick="shareBackup()">📤 보내기</button>' : ''}
            <button class="btn btn-sm btn-plain" onclick="document.getElementById('backup-file').click()">📂 불러오기</button>
          </div>
          <div class="bk-note">기록은 이 기기의 브라우저에만 저장됩니다. 공부를 마치면 파일로 저장해 두세요${SHARE_OK ? ' ([보내기]로 카카오톡 나에게·드라이브에 보내도 됨)' : ''}. 다른 기기에서 [불러오기]를 하면 두 기록이 합쳐집니다.</div>
        </div>`;
    }
    function renderBackupCard() {
      ['backup-today', 'backup-settings'].forEach(id => { const el = document.getElementById(id); if (el) el.innerHTML = backupCardHtml(); });
    }
    function importBackup(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          const st = data && data.state;
          if (!st || data.app !== 'jlpt-study' || typeof st.stamps !== 'object') throw new Error('형식이 다릅니다');
          mergeImportedState(st);
          persist();
          const keys = Object.keys(studyState.stamps);
          alert(`불러오기 완료 (지금 기록과 합침)\n푼 어휘 ${keys.filter(k => k.startsWith('v:')).length}개 · 푼 문법 문제 ${keys.filter(k => k.startsWith('d:')).length}개 · 완독 ${studyState.readCompleted.length}편 · 푼 청해 ${keys.filter(k => k.startsWith('l:')).length}문항 · 모의고사 ${mockHistory().length}회`);
        } catch (e) { alert('백업 파일을 읽지 못했습니다: ' + e.message); }
        input.value = '';
      };
      reader.readAsText(file);
    }

    function saveState() {
      try { localStorage.setItem('jlpt_study_state', JSON.stringify(studyState)); if (storageError) { storageError = ''; renderBackupCard(); } }
      catch (e) { storageError = (e && e.name) || '저장 실패'; renderBackupCard(); }
    }
    function persist() { saveState(); }

    // 백업 파일의 기록을 지금 기록과 합치기
    // 항목별로 더 최근에 바뀐 쪽을 채택 → 다른 기기에서 해제한 것도 제대로 반영됨
    function mergeImportedState(cloudData) {
      const cloud = {
        memorized: cloudData.memorized || [],
        confused: cloudData.confused || [],
        readCompleted: cloudData.readCompleted || [],
        grammarDone: cloudData.grammarDone || [],
        stamps: { ...(cloudData.stamps || {}) }
      };
      ensureStamps(cloud);
      // 둘 다 기록 시각이 없는(예전 형식) 경우: 외움 > 헷갈림 > 해제 순으로 우선 (기존 합집합 동작과 동일)
      const rank = v => (v === 'm' ? 3 : v === 'c' ? 2 : v === 1 ? 1 : 0);
      Object.keys(cloud.stamps).forEach(key => {
        const c = cloud.stamps[key], l = studyState.stamps[key];
        if (!l || (c.t || 0) > (l.t || 0) || ((c.t || 0) === (l.t || 0) && rank(c.v) > rank(l.v))) studyState.stamps[key] = c;
      });
      rebuildFromStamps();
      studyState.quizWrongCount = { ...studyState.quizWrongCount, ...(cloudData.quizWrongCount || {}) };
      const cloudSrs = cloudData.srs || {};
      Object.keys(cloudSrs).forEach(id => {
        const local = studyState.srs[id];
        if (!local || (cloudSrs[id].t || 0) > (local.t || 0)) studyState.srs[id] = cloudSrs[id];
      });
      saveState();
      initDaySelector();
      renderVocab();
      const active = id => document.getElementById(id).classList.contains('active');
      if (active('tab-today')) renderToday();
      if (active('tab-grammar')) renderGrammarRef();
      if (active('tab-reading')) renderReading();
      if (active('tab-listen') && listenMode === 'practice') renderListen();
      if (active('tab-stats')) renderStatsDashboard();
    }

    // ===== TTS (음성 합성) =====
    // 모든 소리는 speakSeq 하나로 재생: 문장 단위로 끊어 읽고(크롬 장문 끊김 방지), 화자별로 목소리·높이를 바꿈
    const TTS = { token: 0, timer: null, poll: null, cur: null, voices: [] };
    function loadVoices() {
      if (!('speechSynthesis' in window)) return;
      TTS.voices = speechSynthesis.getVoices();
    }

        if (byType[v.k] && v.r) { byType[v.k][1]++; if (v.r === 'o') byType[v.k][0]++; }
      });
      const due = vocabDueWords().length, cycAll = vocabCycleWords().length;

        <button class="quick-link" style="width:100%; margin-bottom:4px;" onclick="goQuizScope('vwrong')" ${due ? '' : 'disabled'}>🔁 틀린 어휘 다시 — 오늘 ${due}개<small>${cycAll ? `다시 볼 단어 ${cycAll}개 중 오늘 나올 차례인 단어 (한 번에 최대 ${PLAN.vocabWrongSize}개, 범위와 관계없이)` : '틀린 단어가 생기면 다음 날부터 여기에 나옵니다'}</small></button>

            <div class="sc-role">${inf.no} · ${inf.ko}</div>

        <div class="stat-box" style="margin-top:14px; padding:12px 14px;">
          <div class="stat-title" style="margin-bottom:6px;"><span>${vocabLevel === 'all' ? '전체' : vocabLevel} 단어 ${pool.length}개 중</span><span style="color:var(--primary);">${pct(ok + cyc, pool.length)}% 풀어 봄</span></div>
          <div class="progress-bar-wrap" style="margin-bottom:6px;"><div class="bar-seg seg-mem" style="width:${pct(ok, pool.length)}%;"></div><div class="bar-seg seg-conf" style="width:${pct(cyc, pool.length)}%;"></div></div>
          <div style="font-size:0.8rem; color:var(--text-muted);">맞힌 단어 ${ok} · 다시 볼 단어 ${cyc} · 아직 안 푼 단어 ${pool.length - ok - cyc}</div>

    }
    function startVocabType(type) {

    }
    function renderVocab() {

    function renderVocabListView() {
      const el = document.getElementById('vocab-list-view'), sc = currentScene();

    // 가린 읽기·뜻: 행을 누르면 모두, 그 부분만 누르면 그것만 보임
    function blindAttr(on) { return on ? `onclick="event.stopPropagation(); this.classList.toggle('reveal')"` : ''; }
    // 왼쪽 색: 초록 = 어휘 문제에서 맞힘 · 빨강 = 다시 볼 단어
    function wordRowHtml(w, i) {
      const kana = shownReading(w), v = vstat(w.id);
      return `
        <div class="word-list-row ${vInCycle(v) ? 'is-confused' : v ? 'is-memorized' : ''}" onclick="this.querySelectorAll('.blur-mask').forEach(x => x.classList.toggle('reveal'))">
          <span class="wl-num">${i + 1}</span>
          <div class="wl-main">
            <div><span class="wl-word">${w.word}</span>${kana ? `<span class="wl-kana ${blindSettings.reading ? 'blur-mask' : ''}" ${blindAttr(blindSettings.reading)}>${kana}</span>` : ''}<span class="wl-day">${w.level}</span></div>
            <div class="wl-mean ${blindSettings.mean ? 'blur-mask' : ''}" ${blindAttr(blindSettings.mean)}>${w.mean || ''}</div>
          </div>
          <button class="wl-btn" data-tts="${escapeHtml(w.word)}" onclick="event.stopPropagation(); playTTS(this.getAttribute('data-tts'))" aria-label="듣기">🔊</button>
        </div>`;
    }
    // ===== 장면·기능 색인 =====
    const STEP_MARKS = '①②③④⑤⑥⑦⑧';
    function currentScene() { return vocabMode === 'scene' ? sceneById.get(sceneSel) || null : null; }
    function sceneVisibleWords(sc) { return sc.steps.flatMap(st => st.words); }
    function sceneCount(sc) { return sc.steps.reduce((a, st) => a + st.words.length, 0); }
    function saveSceneState() {
      try { localStorage.setItem('jlpt_scene', sceneSel); localStorage.setItem('jlpt_scene_tab', sceneTab); } catch (e) {}
    }
    function renderSceneView() {
      const el = document.getElementById('scene-view');
      if (!el) return;
      if (vocabMode !== 'scene') { el.innerHTML = ''; return; }
      const sc = currentScene();
      if (!sc) { el.innerHTML = sceneBrowserHtml(); return; }
      const dom = SCENE_DOMS.find(d => d.id === sc.d);
      const n = sceneCount(sc);
      el.innerHTML = `
        <div class="scene-head">
          <button class="btn btn-sm btn-plain" onclick="closeScene()">← ${sc.d === 'func' ? '기능' : '장면'} 목록</button>
          <div class="sc-role" style="margin-top:12px;">${dom ? `${dom.icon} ${dom.label}` : ''} · ${sc.role}</div>
          <div class="scene-title">${sc.title}</div>
          <div class="sc-ja">${sc.ja} <button class="wl-btn scene-tts" data-tts="${escapeHtml(sc.ja)}" aria-label="일본어 제목 듣기">🔊</button></div>
          <div class="scene-flow">${sc.steps.map((st, i) => `<span class="scene-flow-step">${STEP_MARKS[i]} ${st.label}</span>`).join('<span class="scene-flow-arrow">→</span>')}</div>
          <div class="scene-actions">
            <button class="btn btn-sm btn-plain" onclick="sceneAudio()" ${n ? '' : 'disabled'}>🔁 몰아듣기 ${n}</button>
            <button class="btn btn-sm btn-plain" onclick="sceneQuiz()" ${n >= 4 ? '' : 'disabled'}>✏️ 이 장면 어휘 문제</button>
          </div>
          <div class="scene-note">단어 왼쪽 색: 초록 = 어휘 문제에서 맞힘 · 빨강 = 다시 볼 단어 · 표시 없음 = 아직 안 푼 단어</div>
        </div>${sceneDialogHtml(sc)}`;
    }
    // 장면 모범 대화: 접어 두었다가 펼쳐서 청해 문제처럼 듣고 풀기
    function sceneDialogHtml(sc) {
      const item = sceneListenOf.get(sc.id);
      if (!item) return '';
      const res = listenResult(item);
      return `<details class="scene-dialog" ${sceneDlgOpen ? 'open' : ''} ontoggle="sceneDlgOpen = this.open">
          <summary>🎧 모범 대화 듣기 <span class="cnt">${LTYPE[item.type].split(' · ')[0]} · ${item.lines.length}줄${res.done ? (res.wrong ? ' · ✗' : ' · ✓') : ''}</span></summary>
          <div class="scene-dialog-tip">실제 시험처럼 대화를 한 번 듣고 답을 고른 뒤, 스크립트에서 장면 단어(굵은 글씨)를 확인하세요.</div>
          ${listenCardHtml(item)}
        </details>`;
    }
    // 오늘의 장면: 오늘 이전에 대화를 풀지 않은 첫 장면 (오늘 풀어도 하루 동안은 그대로) → 다 풀었으면 틀린 장면, 그다음은 날짜 순환
    function todaySceneOf(ds) {
      const today0 = dateObj(ds).getTime();
      const before = sc => { const it = sceneListenOf.get(sc.id); return it.qs.map((q, qi) => { const k = `l:${it.id}-${qi}`; const t = stampT(k); return t && t < today0 ? stampV(k) : null; }); };
      const fresh = SCENE_ROTATION.find(sc => before(sc).every(v => v == null));
      if (fresh) return fresh;
      const wrong = SCENE_ROTATION.find(sc => before(sc).includes('x'));
      if (wrong) return wrong;
      const n = Math.round((today0 - dateObj(PLAN.startDate).getTime()) / 86400000);
      return SCENE_ROTATION[((n % SCENE_ROTATION.length) + SCENE_ROTATION.length) % SCENE_ROTATION.length];
    }
    function goTodayScene(id) { sceneDlgOpen = true; goScene(id); }
    // 청해 탭의 장면 대화에서 → 어휘 탭의 그 장면으로
    function goScene(id) {
      if (listenPlayingId) stopListen();
      sceneSel = id; saveSceneState();
      if (vocabMode !== 'scene') setVocabMode('scene');
      switchTab('vocab');
      window.scrollTo(0, 0);
    }
    function sceneBrowserHtml() {
      const nScene = SCENES.filter(x => x.d !== 'func').length, nFunc = SCENES.length - nScene;
      const list = SCENES.filter(x => (sceneTab === 'func') === (x.d === 'func'));
      const tp = todayPlanCache, sceneTask = tp && tp.date === todayStr() ? tp.extras.find(t => t.kind === 'scene') : null;
      const todayId = sceneTask ? sceneTask.go.match(/'([^']+)'/)[1] : '';   // 오늘 할 일에 '오늘의 장면'이 있을 때만 표시
      const card = x => {
        const all = sceneVisibleWords(x);
        const okN = all.filter(w => { const v = vstat(w.id); return v && !vInCycle(v); }).length;
        return `<button class="scene-card" onclick="openScene('${x.id}')">
          <div class="sc-role">${x.id === todayId ? '<span class="task-tag tag-extra">오늘</span>' : ''}${x.role}</div>
          <div class="sc-title">${x.title}</div>
          <div class="sc-ja">${x.ja}</div>
          <div class="sc-bar"><span style="width:${all.length ? Math.round(okN / all.length * 100) : 0}%"></span></div>
          <div class="sc-meta">단어 ${all.length}개 · 맞힘 ${okN}${sceneListenOf.has(x.id) ? ' · 🎧' : ''}</div>
        </button>`;
      };
      return `
        <div class="seg scene-tabs">
          <button class="${sceneTab !== 'func' ? 'active' : ''}" onclick="setSceneTab('scene')">🎬 장면 ${nScene}</button>
          <button class="${sceneTab === 'func' ? 'active' : ''}" onclick="setSceneTab('func')">🧭 기능 ${nFunc}</button>
        </div>
        <div class="info-banner">${sceneTab === 'func'
          ? '장면 하나로 묶기 어려운 부사·형용사·접속사 등을 쓰임(기능)별로 묶었습니다. 즉시응답·문맥규정·독해 대비용입니다.'
          : '앱의 단어를 목적·상황(스크립트) 단위로 다시 묶었습니다. 장면마다 흐름(①→②→③) 순서로 단어가 놓여 있어, 청해 과제이해처럼 \'다음에 무엇을 하는가\'를 떠올리며 복습할 수 있습니다.'}</div>
        ${SCENE_DOMS.filter(d => list.some(x => x.d === d.id)).map(d => `
          <div class="scene-domain">${d.icon} ${d.label}</div>
          <div class="scene-grid">${list.filter(x => x.d === d.id).map(card).join('')}</div>`).join('')}`;
    }
    function sceneListHtml(sc) {
      let i = 0;
      const body = sc.steps.map((st, k) => `
        <div class="scene-step-head"><span>${STEP_MARKS[k]} ${st.label}</span><span class="cnt">${st.words.length}개</span></div>

      const extra = (sc.extra || []).length ? `
        <div class="scene-step-head"><span>💬 장면 표현</span><span class="cnt">단어 목록 밖 표현 · 문제에 안 나옴</span></div>
        ${sc.extra.map(([ja, kana, ko]) => {
          const reading = shownReading({ word: ja, kana });
          return `<div class="word-list-row scene-extra" onclick="this.querySelectorAll('.blur-mask').forEach(x => x.classList.toggle('reveal'))">
            <div class="wl-main">
              <div><span class="wl-word">${ja}</span>${reading ? `<span class="wl-kana ${blindSettings.reading ? 'blur-mask' : ''}" ${blindAttr(blindSettings.reading)}>${reading}</span>` : ''}</div>
              <div class="wl-mean ${blindSettings.mean ? 'blur-mask' : ''}" ${blindAttr(blindSettings.mean)}>${ko}</div>
            </div>
            <button class="wl-btn" data-tts="${escapeHtml(ja)}" onclick="event.stopPropagation(); playTTS(this.getAttribute('data-tts'))" aria-label="듣기">🔊</button>
          </div>`;
        }).join('')}` : '';

    }
    function setSceneTab(tab) { sceneTab = tab; saveSceneState(); renderVocab(); }
    function openScene(id) { if (listenPlayingId) stopListen(); sceneSel = id; saveSceneState(); renderVocab(); window.scrollTo(0, 0); }
    function closeScene() {
      if (listenPlayingId) stopListen();

    }
    function sceneAudio() {
      if (!currentScene()) return;
      stopAudioMode();

      saveAudioOpts();

      if (listenMode !== 'audio') setListenMode('audio'); else renderListen();

    function sceneQuiz() {
      const sc = currentScene();
      if (!sc) return;
      const words = sceneVisibleWords(sc);
      if (words.length < 4) return;
      switchTab('quiz', null, true);
      document.querySelectorAll('#quiz-scope-bar .chip').forEach(c => c.classList.remove('active'));
      startQuiz(vocabMixed(words), () => vocabMixed(words));
