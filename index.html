    // ===== 독해 탭 =====
    function readingMatches(item, filter) {
      if (filter === 'extra') return item.type === 'integrated' || item.type === 'info';
      return item.type === filter;
    }
    // 문제 풀이 기록: [정답 수, 푼 문항 수, 문항 수]
    function readingScore(item) {
      const qs = item.questions || [];
      let ok = 0, done = 0;
      qs.forEach((q, qi) => { const v = stampV(`a:${item.id}-${qi}`); if (v) { done++; if (v === 'o') ok++; } });
      return [ok, done, qs.length];
    }
    function readingHasWrong(item) { return (item.questions || []).some((q, qi) => stampV(`a:${item.id}-${qi}`) === 'x'); }
    function fmtSec(sec) { sec = Math.max(0, Math.round(sec)); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; }

    const readingTimers = {};   // { 지문id: { start, running, iv } }
    function readingTimerHtml(item) {
      const target = (PLAN.readingTarget[item.type] || 5) * 60;
      const tm = readingTimers[item.id];
      const last = stampV(`e:${item.id}`);
      const label = tm && tm.running ? '⏱ 재는 중' : last ? `⏱ 지난 기록 ${fmtSec(last)} ${last <= target ? '✓' : '(초과)'}` : '⏱ 실전 타이머';
      return `<div class="reading-timer" id="rt-${item.id}"><span>${label} · 목표 ${fmtSec(target)}</span>
        <span><span class="t" id="rt-t-${item.id}">${tm && tm.running ? fmtSec((Date.now() - tm.start) / 1000) : ''}</span>
        <button class="btn btn-sm btn-plain" onclick="toggleReadingTimer(${item.id})">${tm && tm.running ? '정지' : last ? '다시 재기' : '시작'}</button></span></div>`;
    }
    function toggleReadingTimer(id) {
      const tm = readingTimers[id];
      if (tm && tm.running) stopReadingTimer(id, false);
      else {
        readingTimers[id] = { start: Date.now(), running: true, iv: setInterval(() => tickReadingTimer(id), 1000) };
        refreshTimerRow(id);
      }
    }
    function tickReadingTimer(id) {
      const tm = readingTimers[id], el = document.getElementById(`rt-t-${id}`);
      if (!tm || !el) return;   // 다른 탭을 잠깐 봐도 시간은 계속 잰다 (카드로 돌아오면 이어서 표시)
      const sec = (Date.now() - tm.start) / 1000, item = readingById.get(id);
      el.textContent = fmtSec(sec);
      el.classList.toggle('over', sec > (PLAN.readingTarget[item.type] || 5) * 60);
    }
    function stopReadingTimer(id, save) {
      const tm = readingTimers[id];
      if (!tm || !tm.running) return;
      clearInterval(tm.iv); tm.running = false;
      if (save) { setStamp(`e:${id}`, Math.round((Date.now() - tm.start) / 1000)); persist(); }
      refreshTimerRow(id);
    }
    function refreshTimerRow(id) {
      const row = document.getElementById(`rt-${id}`), item = readingById.get(id);
      if (row && item) row.outerHTML = readingTimerHtml(item);
    }
    function readingLogHtml(item) {
      const [ok, done, n] = readingScore(item);
      const sec = stampV(`e:${item.id}`);
      if (!done && !sec) return '';
      const target = (PLAN.readingTarget[item.type] || 5) * 60;
      return `<div class="reading-log">지난 풀이: ${done ? `${ok}/${n} 정답` : '문제 미응시'}${sec ? ` · ⏱ ${fmtSec(sec)} ${sec <= target ? '(목표 이내 ✓)' : `(목표 ${fmtSec(target)} 초과)`}` : ''}</div>`;
    }

    function readingCardHtml(item, showDay) {
      const isRead = studyState.readCompleted.includes(item.id);
      const isPlain = item.plain || item.type === 'info' || item.type === 'integrated';
      const questions = Array.isArray(item.questions) ? item.questions : [];
      return `
          <div class="reading-meta">
            <span class="badge ${READING_TYPE_BADGE[item.type] || 'badge-short'}">${READING_TYPE_LABEL[item.type] || item.type}</span>
            <div style="display:flex; gap:6px; align-items:center;">
              <button class="btn-read-check ${isRead ? 'active' : ''}" onclick="toggleReadingRead(${item.id}, this)">
                ${isRead ? '✓ 완독 완료' : '완독 체크'}
              </button>
              <button class="btn-tts-lg" data-tts="${escapeHtml(item.paragraphs.join(' '))}">🔊 전체 청취</button>
            </div>
          </div>
          <h2 class="reading-title">${showDay ? `<span class="char-count">[DAY ${item.day}]</span> ` : ''}${item.title} <span class="char-count">[본문 ${charLength(item).toLocaleString()}자]</span></h2>
          ${readingLogHtml(item)}
          ${questions.length ? readingTimerHtml(item) : ''}
          <div class="reading-text ${isPlain ? 'plain' : ''}">${item.paragraphs.map(p => `<p>${p}</p>`).join('')}</div>
          ${questions.length ? `
            <div class="rq-wrap">
              <div class="rq-title">✏️ 실전 문제 (${questions.length}문항) — 해석을 보기 전에 먼저 풀어 보세요</div>
              ${questions.map((q, qi) => `
                <div class="rq-item">
                  <div class="rq-q">問${qi + 1}. ${q.q}</div>
                  ${q.options.map((opt, oi) => `
                    <button class="rq-opt" onclick="checkReadingAnswer(this, ${item.id}, ${qi}, ${oi}, ${q.answer})">${'①②③④'[oi]} ${opt}</button>
                  `).join('')}
                  <div class="rq-exp"><strong>정답: ${'①②③④'[q.answer]}</strong><br>${q.desc || ''}</div>
                </div>
              `).join('')}
            </div>` : ''}
          <button class="btn btn-plain" style="margin-bottom:14px; width:100%;" onclick="toggleTranslation(this)">
            🔍 한국어 전체 해석 펼치기
          </button>
          <div class="reading-trans">${item.transParagraphs.map(p => `<p>${p}</p>`).join('')}</div>
          <div class="grammar-note">
            <div class="grammar-title">📌 핵심 문법 및 어휘 해설</div>
            <ul class="grammar-list">${item.grammarNotes.map(n => `<li>${n}</li>`).join('')}</ul>
          </div>
        `;
    }

    function renderReading() {
      const container = document.getElementById('reading-list');
      if (!container) return;
      container.innerHTML = '';

      let filtered = READINGS.filter(item => readingMatches(item, readingFilter) && item.day === currentDay);
      let reviewNote = '';
      let showDay = false;
      if (readingFilter === 'wrong') {
        filtered = READINGS.filter(readingHasWrong);
        showDay = true;
        reviewNote = filtered.length ? `✗ 문제를 틀린 적이 있는 지문 ${filtered.length}편 (모든 DAY). 다시 풀어서 맞히면 목록에서 빠집니다.` : '';
        if (!filtered.length) {
          container.innerHTML = `<div class="empty-box">🎉 틀린 독해 문제가 없습니다.<br>지문 아래 실전 문제를 풀면 결과가 기록됩니다.</div>`;
          return;
        }
      }

      if (filtered.length === 0) {
        const days = Array.from(new Set(READINGS.filter(item => readingMatches(item, readingFilter)).map(r => r.day))).sort((a, b) => a - b);
        container.innerHTML = `
          <div class="empty-box">
            DAY ${currentDay}에는 이 유형의 지문이 없습니다.
            ${days.length ? `<div style="margin-top:10px;">${days.map(d => `<button class="day-jump" onclick="changeDay(${d})">DAY ${d}</button>`).join('')}</div>` : ''}
          </div>`;
        return;
      }

      if (reviewNote) {
        const note = document.createElement('div');
        note.className = 'review-banner';
        note.textContent = reviewNote;
        container.appendChild(note);
      }
      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'reading-card';
        card.id = `reading-card-${item.id}`;
        card.innerHTML = readingCardHtml(item, showDay);
        container.appendChild(card);
      });
    }

    function checkReadingAnswer(btn, id, qi, chosen, correct) {
      const item = btn.closest('.rq-item');
      const opts = item.querySelectorAll('.rq-opt');
      opts.forEach(b => b.disabled = true);
      btn.classList.add(chosen === correct ? 'correct' : 'wrong');
      if (chosen !== correct) opts[correct].classList.add('correct');
      item.querySelector('.rq-exp').style.display = 'block';
      recordResult(`a:${id}-${qi}`, chosen === correct);
      // 이 카드의 문제를 다 풀면: 타이머 정지·기록, 완독 자동 체크
      const card = btn.closest('.reading-card');
      const all = card.querySelectorAll('.rq-item');
      const answered = [...all].filter(x => x.querySelector('.rq-opt:disabled')).length;
      if (answered === all.length) {
        stopReadingTimer(id, true);
        if (!studyState.readCompleted.includes(id)) {
          setFlag('r', id, true);
          const chk = card.querySelector('.btn-read-check');
          if (chk) { chk.classList.add('active'); chk.textContent = '✓ 완독 완료'; }
        }
      }
      persist();
    }

    function toggleReadingRead(id, btn) {
      const on = !studyState.readCompleted.includes(id);
      setFlag('r', id, on);
      btn.classList.toggle('active', on);
      btn.textContent = on ? '✓ 완독 완료' : '완독 체크';
      persist();
    }
    function openReading(id) {
      const item = readingById.get(id);
      if (!item) return;
      if (item.day !== currentDay) changeDay(item.day);
      readingFilter = item.type === 'integrated' || item.type === 'info' ? 'extra' : item.type;
      document.querySelectorAll('#tab-reading .chip').forEach(c => c.classList.toggle('active', c.dataset.rtype === readingFilter));
      switchTab('reading');
      const card = document.getElementById(`reading-card-${id}`);
      if (card) setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
    }

    // ===== 문법 탭 (N2 문형 정리) =====
    let grefMode = 'day';     // 'day' = 그날 DAY 문형 카드 / 'list' = 기능별로 묶은 전체 문형 목록
    try { if (localStorage.getItem('jlpt_gref_mode') === 'list') grefMode = 'list'; } catch (e) {}
    let grefCat = 'all';
    let grefStatus = 'all';   // 전체 목록 거르기: all | todo(아직 못 외움) | done(외운 문형) | wrong(문제 틀린 문형)
    let grefBlind = false;
    const grefOpen = new Set();   // 전체 목록에서 펼쳐 둔 문형 (외웠음을 눌러 다시 그려도 그대로)

    // DAY별 문법 범위
    function drillWrong(d) { return stampV('d:' + d.id) === 'x'; }
    function drillDone(d) { return !!stampV('d:' + d.id); }
    function patternWrong(gid) { return ALL_DRILLS.some(d => d.g === gid && drillWrong(d)); }
    function grammarDayPatterns(day) { return GREF.filter(g => grammarDayOf.get(g.id) === day); }
    function drillsForDay(day) { return ALL_DRILLS.filter(d => drillDay(d) === day); }
    function renderDrillBar() {
      const el = document.getElementById('drill-bar');
      if (!el) return;
      if (grefMode === 'list' && grefStatus !== 'wrong') { el.innerHTML = ''; return; }
      if (grefMode === 'list') {
        const wrong = ALL_DRILLS.filter(drillWrong);
        el.innerHTML = wrong.length ? `<div class="drill-bar"><span>✗ 틀린 문법 문제 ${wrong.length}개 — 맞히면 목록에서 빠집니다</span><button class="btn btn-sm btn-primary" onclick="startGrammarDrill('wrong')">다시 풀기 ▶</button></div>` : '';
        return;
      }
      const items = drillsForDay(currentDay);
      const fill = items.filter(d => d.id[0] === 'f').length, order = items.filter(d => d.id[0] === 'o').length, pass = items.filter(d => d.id[0] === 'p').length;
      const done = items.filter(drillDone).length, ok = items.filter(d => stampV('d:' + d.id) === 'o').length;
      el.innerHTML = items.length ? `<div class="drill-bar"><span>✏️ DAY ${currentDay} 문법 문제<br><span style="font-size:0.78rem;">문법 형식 ${fill} · 문장 배열(★) ${order}${pass ? ` · 글의 문법 ${pass}` : ''} + 이전 DAY 복습 ${PLAN.grammarReviewSize} · 푼 문제 ${done}/${items.length}${done ? ` (정답 ${ok})` : ''}</span></span>
        <button class="btn btn-sm btn-primary" onclick="startGrammarDrill()">풀기 ▶</button></div>`
        : '';
    }
    function startGrammarDrill(mode) {
      switchTab('quiz', null, true);
      quizScope = 'gdrill';
      gdrillMode = mode || 'day';
      document.querySelectorAll('#quiz-scope-bar .chip').forEach(c => c.classList.toggle('active', c.dataset.scope === 'gdrill'));
      startQuiz();
    }

    function renderGrefCatBar() {
      const bar = document.getElementById('gref-cat-bar');
      if (!bar || bar.childElementCount) return;
      [{ key: 'all', label: '전체' }, ...GREF_CATS].forEach(cat => {
        const b = document.createElement('button');
        b.className = 'chip' + (cat.key === grefCat ? ' active' : '');
        b.textContent = cat.label;
        b.onclick = () => {
          grefCat = cat.key;
          bar.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === b));
          renderGrammarRef();
        };
        bar.appendChild(b);
      });
    }

    // 문형 하나의 자세한 내용 (접속·예문·팁·외웠음) — DAY 카드와 전체 목록에서 같이 씀
    function grefDetailHtml(g, isDone, withMean) {
      const blur = grefBlind ? 'blur-mask' : '';
      return `
            <div class="gref-head">
              <div>${withMean ? `<span class="gref-pattern">${g.p}</span>` : ''}<span class="gref-level ${g.level}" ${withMean ? '' : 'style="margin-left:0;"'}>${g.level}</span><span class="gref-level day">DAY ${grammarDayOf.get(g.id)}</span>${patternWrong(g.id) ? '<span class="gref-level" style="background:var(--red-bg-2); color:var(--red-text);">✗ 오답</span>' : ''}</div>
              <button class="btn-gref-check ${isDone ? 'active' : ''}" onclick="toggleGrammarDone('${g.id}')">${isDone ? '✓ 외움' : '외웠음'}</button>
            </div>
            <div class="gref-conn">접속: ${g.c}</div>
            ${withMean ? `<div class="gref-mean ${blur}" onclick="this.classList.toggle('reveal')">${g.m}</div>` : ''}
            <div class="example-box" style="margin-bottom:0;">
              <div class="example-header">
                <span>${g.ja}</span>
                <button class="btn-tts-sm" data-tts="${escapeHtml(g.ja)}">🔊</button>
              </div>
              <span class="example-ko ${blur}" onclick="this.classList.toggle('reveal')">${g.ko}</span>
            </div>
            ${g.tip ? `<div class="gref-tip">💡 ${g.tip}</div>` : ''}`;
    }
    function renderGrammarRef() {
      const listEl = document.getElementById('gref-list');
      if (!listEl) return;
      const listMode = grefMode === 'list';
      ['gref-cat-bar', 'gref-status-bar', 'gref-search'].forEach(id => { document.getElementById(id).style.display = listMode ? '' : 'none'; });
      if (listMode) renderGrefCatBar();
      const done = new Set(studyState.grammarDone);
      const doneCount = GREF.filter(g => done.has(g.id)).length;
      renderDrillBar();

      // DAY 문형: 그날 배울 4~5개를 카드로
      if (!listMode) {
        const list = grammarDayPatterns(currentDay);
        document.getElementById('gref-summary').textContent = `DAY ${currentDay} 문형 ${list.length}개 · N2 핵심 문형 ${GREF.length}개 중 ${doneCount}개 암기 (전체는 📋 전체 문형 목록에서)`;
        listEl.innerHTML = list.length ? list.map(g => `<div class="gref-card ${done.has(g.id) ? 'done' : ''}">${grefDetailHtml(g, done.has(g.id), true)}</div>`).join('')
          : '<div class="empty-box">이 DAY에는 새 문형이 없습니다.</div>';
        return;
      }

      // 전체 문형 목록: DAY와 상관없이 146개를 기능별로 묶어 한 줄씩 → 누르면 펼쳐서 자세히
      const q = (document.getElementById('gref-search').value || '').trim();
      let list = GREF.filter(g => grefCat === 'all' || g.cat === grefCat);
      if (grefStatus === 'todo') list = list.filter(g => !done.has(g.id));
      if (grefStatus === 'done') list = list.filter(g => done.has(g.id));
      if (grefStatus === 'wrong') list = list.filter(g => patternWrong(g.id));
      if (q) list = list.filter(g => [g.p, g.m, g.c, g.ja, g.ko, g.tip || ''].join(' ').includes(q));
      document.getElementById('gref-summary').textContent = `N2 핵심 문형 ${GREF.length}개 중 ${doneCount}개 암기 · 지금 ${list.length}개 표시 · 줄을 누르면 접속·예문이 펼쳐집니다`;
      if (list.length === 0) {
        listEl.innerHTML = `<div class="empty-box">${grefStatus === 'wrong' ? '틀린 문법 문제가 없습니다.' : '조건에 맞는 문형이 없습니다.'}</div>`;
        return;
      }
      const blur = grefBlind ? 'blur-mask' : '';
      const row = g => {
        const isDone = done.has(g.id), wrong = patternWrong(g.id);
        return `<details class="gl-row ${wrong ? 'wrong' : isDone ? 'done' : ''}" ${grefOpen.has(g.id) ? 'open' : ''} ontoggle="grefOpen[this.open ? 'add' : 'delete']('${g.id}')">
            <summary>
              <div class="gl-main">
                <div><span class="gl-p">${g.p}</span><span class="gl-day">D${grammarDayOf.get(g.id)}</span>${isDone ? '<span class="gl-day" style="color:var(--accent-green); border-color:var(--accent-green);">✓ 외움</span>' : ''}${wrong ? '<span class="gl-day" style="color:var(--accent-red); border-color:var(--accent-red);">✗ 오답</span>' : ''}</div>
                <div class="gl-m ${blur}" ${grefBlind ? `onclick="event.preventDefault(); this.classList.toggle('reveal')"` : ''}>${g.m}</div>
              </div>
              <span class="gl-arrow">▾</span>
            </summary>
            <div class="gl-body">${grefDetailHtml(g, isDone, false)}</div>
          </details>`;
      };
      listEl.innerHTML = GREF_CATS.map(cat => {
        const items = list.filter(g => g.cat === cat.key);
        if (!items.length) return '';
        const all = GREF.filter(g => g.cat === cat.key), days = all.map(g => grammarDayOf.get(g.id));
        const dMin = Math.min(...days), dMax = Math.max(...days);
        return `<div class="gl-cat"><span>${cat.label} <span class="cnt">${items.length < all.length ? `${items.length}/` : ''}${all.length}개</span></span><span class="cnt">DAY ${dMin}${dMax > dMin ? `~${dMax}` : ''} · 외움 ${all.filter(g => done.has(g.id)).length}/${all.length}</span></div>${items.map(row).join('')}`;
      }).join('');
    }

    function toggleGrammarDone(id) {
      setFlag('g', id, !studyState.grammarDone.includes(id));
      persist();
      renderGrammarRef();
    }
    function setGrefMode(mode) {
      grefMode = mode;
      try { localStorage.setItem('jlpt_gref_mode', mode); } catch (e) {}
      syncGrefModeButtons();
      renderGrammarRef();
      window.scrollTo(0, 0);
    }
    function syncGrefModeButtons() {
      ['day', 'list'].forEach(m => document.getElementById(`gmode-${m}`).classList.toggle('active', grefMode === m));
    }
    function setGrefStatus(status, btn) {
      grefStatus = status;
      document.querySelectorAll('#gref-status-bar .chip-sm').forEach(c => c.classList.toggle('active', c === btn));
      renderGrammarRef();
    }
    function toggleGrefBlind() {
      grefBlind = !grefBlind;
      document.getElementById('btn-gref-blind').classList.toggle('active', grefBlind);
      renderGrammarRef();
    }

    function toggleTranslation(btn) {
      const transBox = btn.nextElementSibling;
      const isVisible = transBox.style.display === 'block';
      transBox.style.display = isVisible ? 'none' : 'block';
      btn.textContent = isVisible ? '🔍 한국어 전체 해석 펼치기' : '▲ 해석 접기';
    }

    function setReadingType(type, btn) {
      readingFilter = type;
      document.querySelectorAll('#tab-reading .chip').forEach(c => c.classList.toggle('active', c === btn));
      renderReading();
    }

    // ===== 퀴즈 탭 =====
    let quizScope = 'vocab';  // vocab(어휘 실전 30) | vwrong(틀린 어휘) | vtype(유형별 연습) | gdrill | mock | gpattern | grammar | weakness(자주 틀린 어휘)
    let vocabTypeSel = 'kanji';   // 유형별 연습에서 고른 유형
    let gdrillMode = 'day';   // 문법 문제: day(오늘 DAY + 이전 DAY 복습) | wrong(틀린 문제만)
    let currentQuizList = [];
    let currentQuizIdx = 0;
    let quizCorrect = 0;
    let quizWrongItems = [];
    let quizMeta = {};        // 지금 퀴즈가 어떤 세트인지 ('오늘' 탭 완료 체크·다시 풀기용)
    let quizAnswered = false; // 지금 화면의 문제를 이미 채점했는지 (다른 탭에 다녀온 뒤 이어 풀기용)

    function setQuizScope(scope, btn) {
      quizScope = scope;
      document.querySelectorAll('#quiz-scope-bar .chip').forEach(c => c.classList.toggle('active', c === btn));
      startQuiz();
    }

    function buildDrillList(mode) {
      if (mode === 'wrong') return shuffle(ALL_DRILLS.filter(drillWrong)).slice(0, 30);
      const today = drillsForDay(currentDay);
      const prev = ALL_DRILLS.filter(d => drillDay(d) < currentDay);
      const review = [...shuffle(prev.filter(drillWrong)), ...shuffle(prev.filter(d => !drillDone(d))), ...shuffle(prev.filter(d => stampV('d:' + d.id) === 'o'))]
        .slice(0, PLAN.grammarReviewSize);
      const list = [...today, ...review];
      // 시험 순서처럼 문법 형식 → 문장 배열 → 글의 문법 (글의 문법은 빈칸 순서대로)
      return [...shuffle(list.filter(d => d.id[0] === 'f')), ...shuffle(list.filter(d => d.id[0] === 'o')),
        ...list.filter(d => d.id[0] === 'p').sort((a, b) => a.id.localeCompare(b.id))];
    }
    function makeDrillQuestion(d) { return d.id[0] === 'f' ? makeFillQuestion(d) : d.id[0] === 'o' ? makeOrderQuestion(d) : makePassageQuestion(d); }
    // 文章の文法: 글 전체를 보여 주고 지금 빈칸만 강조
    function passageHtml(ps, cur) {
      return ps.text.map(par => `<p>${par.replace(/\{(\d)\}/g, (m, n) => Number(n) === cur
        ? `<b style="color:var(--primary); background:var(--sky-bg); padding:0 2px;">（ ${n} ）</b>` : `（ ${n} ）`)}</p>`).join('');
    }
    function makePassageQuestion(it) {
      const q = it.ps.q[it.bi];
      const options = shuffle(q.o);
      return {
        kind: 'gpass', src: it, drillId: it.id,
        q: `<span class="q-tag">文章の文法 · DAY ${it.day} · ${it.ps.title}</span><div class="passage-box">${passageHtml(it.ps, it.bi + 1)}</div><span style="font-size:0.92rem;">（ ${it.bi + 1} ）에 들어갈 가장 알맞은 것은?</span>`,
        sub: '', options, answer: options.indexOf(q.o[q.a]),
        desc: q.d + `<details class="more-details"><summary>▼ 글 전체 해석</summary>${it.ps.ko.map(x => `<p style="margin-bottom:6px;">${x}</p>`).join('')}</details>`
      };
    }
    // 用法: 단어가 바르게 쓰인 문장 고르기 (각 문장 속 단어에 밑줄)
    function underlineIn(sentence, word) {
      for (let k = word.length; k >= 1; k--) {
        const part = word.slice(0, k);
        if (sentence.includes(part)) return sentence.replace(part, `<u>${part}</u>`);
      }
      return sentence;
    }
    function makeUsageQuestion(u) {
      const w = vocabById.get(u.wordId) || {};
      const marked = u.o.map(x => underlineIn(x, u.w));
      const correct = marked[u.a];
      const options = shuffle(marked);
      return {
        kind: 'usage', src: u, drillId: u.id, wordId: u.wordId,
        q: `<span class="q-tag">用法 · DAY ${u.day}</span><br><span style="font-size:1.5rem;">${u.w}</span>${shownReading(w) ? ` <span style="font-size:0.9rem; color:var(--primary); font-weight:normal;">【${shownReading(w)}】</span>` : ''}<br><span style="font-size:0.9rem; color:var(--text-muted); font-weight:normal;">이 말이 가장 알맞게 쓰인 문장은?</span>`,
        sub: '', options, answer: options.indexOf(correct),
        desc: `<b>${correct}</b><br>${u.ko}<br><span style="font-size:0.86rem;">${u.d}</span>`
      };
    }
    // presetList: 문제 목록(이미 만든 문제 또는 { type, src|word }) / again: '새로 섞어서 다시'에서 새 목록을 만드는 함수
    function startQuiz(presetList, again) {
      currentQuizIdx = 0;
      quizCorrect = 0;
      quizWrongItems = [];
      quizMeta = { scope: quizScope, day: currentDay, preset: !!presetList, again: presetList ? again : null };
      const container = document.getElementById('quiz-container');
      if (quizScope === 'mock' && !presetList) { renderMockHome(); return; }

      if (presetList) {
        currentQuizList = presetList.map(q => q.kind ? q
          : q.type === 'grammar' ? makeGrammarQuestion(q.src)
          : q.type === 'pattern' ? makePatternQuestion(q.src)
          : q.type === 'drill' ? makeDrillQuestion(q.src)
          : q.type === 'vocab' ? vocabQuestion(q.vtype, q.word) || vocabMixedQ(q.word)
          : null).filter(Boolean);
      } else if (quizScope === 'vocab') {
        currentQuizList = buildVocabSet();
      } else if (quizScope === 'vwrong') {
        currentQuizList = buildVocabWrong();
      } else if (quizScope === 'vtype') {
        currentQuizList = buildVocabType(vocabTypeSel);
      } else if (quizScope === 'weakness') {
        currentQuizList = vocabMixed(weakWords().slice(0, 15).map(x => vocabById.get(x.id)));
      } else if (quizScope === 'gdrill') {
        currentQuizList = buildDrillList(gdrillMode).map(makeDrillQuestion);
      } else if (quizScope === 'gpattern') {
        // 아직 못 외운 문형 위주로 20문항
        const done = new Set(studyState.grammarDone);
        const todo = GREF.filter(g => !done.has(g.id));
        currentQuizList = shuffle(todo.length >= 5 ? todo : GREF).slice(0, 20).map(makePatternQuestion);
      } else if (quizScope === 'grammar') {
        const pool = GRAMMAR_QUIZ.filter(g => (g.day || 1) <= currentDay);
        currentQuizList = shuffle(pool).map(makeGrammarQuestion);
      }

      if (currentQuizList.length === 0) {
        const msg = quizScope === 'vwrong' ? `🎉 오늘 다시 풀 어휘가 없습니다.<br>틀린 단어는 다음 날 → 3일 → 7일 → 14일 뒤에 여기에 나옵니다.${vocabCycleWords().length ? `<br>(다시 볼 단어 ${vocabCycleWords().length}개는 나올 날을 기다리는 중)` : ''}`
          : quizScope === 'weakness' ? '자주 틀린 어휘가 없습니다.'
          : quizScope === 'gdrill' ? `선택한 조건에 풀 수 있는 문제가 없습니다. ${gdrillMode === 'wrong' ? '(틀린 문법 문제가 없습니다)' : '(이 DAY 범위의 문법 문제를 모두 맞혔습니다)'}`
          : '선택한 조건에 풀 수 있는 문제가 없습니다.';
        container.innerHTML = `<div class="empty-box">${msg}</div>`;
        return;
      }
      renderQuizQuestion();
    }

    function pickDistractors(item, n, keyFn, exclude) {
      const used = new Set([keyFn(item), ...(exclude || [])]);
      const out = [];
      const tryAdd = (cands) => {
        for (const c of shuffle(cands)) {
          if (out.length >= n) break;
          const k = keyFn(c);
          if (!k || used.has(k)) continue;
          used.add(k);
          out.push(k);
        }
      };
      tryAdd(VOCAB.filter(w => w.id !== item.id && posGroup(w) === posGroup(item)));
      if (out.length < n) tryAdd(VOCAB.filter(w => w.id !== item.id));
      return out;
    }

    // 요미가나 오답 생성: 탁음·장음·촉음·요음 혼동 (N2 문제1 漢字読み 형식)
    const DAKU = { か:'が', き:'ぎ', く:'ぐ', け:'げ', こ:'ご', さ:'ざ', し:'じ', す:'ず', せ:'ぜ', そ:'ぞ', た:'だ', て:'で', と:'ど', は:'ば', ひ:'び', ふ:'ぶ', へ:'べ', ほ:'ぼ', ぱ:'は', ぴ:'ひ', ぷ:'ふ', ぺ:'へ', ぽ:'ほ' };
    Object.keys(DAKU).forEach(k => { if (!DAKU[DAKU[k]]) DAKU[DAKU[k]] = k; });
    const O_ROW = 'おこそとのほもよろごぞどぼぽょ';
    const U_ROW = 'くすつぬふむゆるぐずぶぷゅ';
    const E_ROW = 'けせてねへめれげぜでべぺ';
    const SOKUON_NEXT = 'かきくけこさしすせそたちつてとぱぴぷぺぽ';
    function readingVariants(kana) {
      const ch = [...kana];
      const out = new Set();
      const at = (i, rep) => ch.slice(0, i).join('') + rep + ch.slice(i + 1).join('');
      for (let i = 0; i < ch.length; i++) {
        const c = ch[i], prev = ch[i - 1], next = ch[i + 1];
        if (DAKU[c]) out.add(at(i, DAKU[c]));
        if (c === 'う' && prev && (O_ROW + U_ROW).includes(prev)) out.add(at(i, ''));
        if (c === 'い' && prev && E_ROW.includes(prev)) out.add(at(i, ''));
        if (O_ROW.includes(c) && next !== 'う' && next !== undefined) out.add(at(i, c + 'う'));
        if (c === 'っ') { out.add(at(i, '')); out.add(at(i, 'つ')); }
        if ('くきちつ'.includes(c) && next && SOKUON_NEXT.includes(next) && i > 0) out.add(at(i, 'っ'));
        if ('ゃゅょ'.includes(c)) [...'ゃゅょ'].filter(x => x !== c).forEach(x => out.add(at(i, x)));
      }
      out.delete(kana);
      return [...out];
    }
    function pickReadingDistractors(item) {
      const kana = item.kana;
      const variants = shuffle(readingVariants(kana));
      const others = shuffle(VOCAB.filter(w => w.id !== item.id && hasKanji(w.word) && posGroup(w) === posGroup(item) && w.kana !== kana && w.kana.slice(-1) === kana.slice(-1)).map(w => w.kana));
      const isKun = ['동사', 'い형용사', '관용구'].includes(posGroup(item));
      const order = isKun ? [...others.slice(0, 2), ...variants, ...others.slice(2)] : [...variants, ...others];
      const out = [];
      for (const k of order) { if (out.length >= 3) break; if (k !== kana && !out.includes(k)) out.push(k); }
      if (out.length < 3) pickDistractors(item, 3 - out.length, w => w.kana).forEach(k => { if (!out.includes(k) && k !== kana) out.push(k); });
      return out;
    }

    // 유의어 오답: 정답과 어미 모양이 같은 것(〜する·〜い·한자 명사 등)을 우선 → 형태만 보고 찍을 수 없게
    function synShape(s) {
      const c = (s || '').slice(-1);
      return /[ぁ-ん]/.test(c) ? 'h' + c : /[ァ-ヶー]/.test(c) ? 'k' : 'c';
    }
    function pickSynDistractors(w) {
      const correct = w.syn[0], shape = synShape(correct), exclude = new Set(w.syn);
      const pool = VOCAB.filter(x => x.id !== w.id && x.syn && x.syn[0] && !exclude.has(x.syn[0]));
      const same = shuffle(pool.filter(x => synShape(x.syn[0]) === shape)).map(x => x.syn[0]);
      const rest = shuffle(pool).map(x => x.syn[0]);
      const out = [];
      for (const s of [...same, ...rest]) { if (out.length >= 3) break; if (s !== correct && !out.includes(s)) out.push(s); }
      return out;
    }

    // 예문 속 표제어(활용형 포함)에 밑줄. 음독 숙어 예문(預金(よきん) 등)은 쓰지 않는다
    function underlinedExample(w) {
      const list = (w.examples || []).filter(e => e.ja && !/[\u4e00-\u9fff々]+\([\u3041-\u3096]+\)/.test(e.ja));
      const full = list.find(e => e.ja.includes(w.word));
      if (full) return full.ja.replace(w.word, `<u>${w.word}</u>`);
      let stem = w.word.replace(/〜/g, '').replace(/\(.*?\)/g, '');
      if (/[\u4e00-\u9fff]/.test(stem)) stem = stem.replace(/[\u3041-\u3096]+$/, '');
      else if (/^(동사|い형용사)/.test(w.pos || '')) stem = stem.slice(0, -1);
      if (stem && stem !== w.word && (stem.length >= 2 || /[\u4e00-\u9fff]/.test(stem))) {
        const hit = list.find(e => e.ja.includes(stem));
        if (hit) return hit.ja.replace(new RegExp(stem + '[\u3041-\u3096]{0,2}'), m => `<u>${m}</u>`);
      }
      return `<u>${w.word}</u>`;
    }

    function makeWordQuestion(w, type) {
      let q, sub = '', correct, distractors;
      if (type === 'reading') {
        q = `<span style="font-size:1.6rem;">${w.word}</span><br><span style="font-size:0.9rem; color:var(--text-muted); font-weight:normal;">の読み方として最もよいものは？</span>`;
        correct = w.kana;
        distractors = pickReadingDistractors(w);
      } else if (type === 'word') {
        q = `「${w.mean}」<br><span style="font-size:0.9rem; color:var(--text-muted); font-weight:normal;">에 해당하는 일본어는?</span>`;
        correct = w.word;
        distractors = pickDistractors(w, 3, x => x.word);
      } else if (type === 'context') {
        // N2 文脈規定 형식: 예문 속 빈칸에 들어갈 말
        const ex = contextExample(w);
        if (!ex) return null;
        q = `<span style="font-size:1.05rem;">${ex.ja.replace(w.word, '<span style="color:var(--primary);">（　　）</span>')}</span><br><span style="font-size:0.9rem; color:var(--text-muted); font-weight:normal;">（　　）에 들어갈 가장 알맞은 말은?</span>`;
        correct = w.word;
        distractors = pickContextDistractors(w);
        sub = '';
        w = Object.assign({}, w, { _exKo: ex.ko });
      } else if (type === 'syn') {
        // N2 言い換え類義 형식: 예문 속 밑줄 단어와 뜻이 가장 가까운 것
        if (!Array.isArray(w.syn) || !w.syn.length) return null;
        const sentence = underlinedExample(w);
        q = `<span style="font-size:1.05rem;">${sentence}</span><br><span style="font-size:0.9rem; color:var(--text-muted); font-weight:normal;">밑줄 친 말과 의미가 가장 가까운 것은?</span>`;
        correct = w.syn[0];
        distractors = pickSynDistractors(w);
      } else {
        q = `[ ${w.word} ] 의 올바른 의미는?`;
        sub = w.kana;
        correct = w.mean;
        distractors = pickDistractors(w, 3, x => x.mean);
      }
      if (distractors.length < 3) return null;
      const options = shuffle([correct, ...distractors]);
      return {
        kind: 'word', type, word: w, wordId: w.id, q, sub, options,
        answer: options.indexOf(correct),
        desc: `<span style="font-size:1.05rem; font-weight:700;">${w.word}</span> ${bracketReading(w)} ${w.pos ? '[' + w.pos + ']' : ''}<br>${w.mean}`
          + (Array.isArray(w.syn) && w.syn.length ? `<br>🔁 유의어: ${w.syn.join(' · ')}` : '')
          + (w._exKo ? `<br><span style="font-size:0.85rem; color:var(--text-muted);">${w._exKo}</span>` : '')
      };
    }

    // 빈칸 문제용 예문: 표제어가 그대로 들어 있고 읽기 괄호가 없는 것
    function contextExample(w) {
      if (!w || /[〜~（(]/.test(w.word)) return null;
      return (w.examples || []).find(e => e.ja && e.ja.includes(w.word) && !/[（(]/.test(e.ja)) || null;
    }
    // 같은 품사·같은 어미(동사·い형용사)에서 오답을 골라 형태만으로는 못 고르게. 유의어 관계인 말은 제외
    function pickContextDistractors(w) {
      const conj = /^(동사|い형용사)/.test(w.pos || '');
      const syn = new Set(w.syn || []);
      const pool = VOCAB.filter(x => x.id !== w.id && posGroup(x) === posGroup(w) && !/[〜~（(]/.test(x.word)
        && (!conj || x.word.slice(-1) === w.word.slice(-1)) && !syn.has(x.word) && !(x.syn || []).includes(w.word) && x.word !== w.word);
      const near = shuffle(pool.filter(x => Math.abs((x.day || 99) - (w.day || 99)) <= 5));
      const out = [];
      for (const x of [...near, ...shuffle(pool)]) { if (out.length >= 3) break; if (!out.includes(x.word)) out.push(x.word); }
      return out;
    }
    function drillPatternNote(gid) {
      const g = grefById.get(gid);
      return g ? `<br><span style="font-size:0.84rem; color:var(--text-muted);">📘 ${g.p} (${g.c}) — ${g.m}<br>${g.ja}</span>` : '';
    }
    function makeFillQuestion(f) {
      const correct = f.o[f.a];
      const options = shuffle(f.o);
      return {
        kind: 'gfill', src: f, drillId: f.id,
        q: `<span class="q-tag">文法形式 · DAY ${drillDay(f)}</span><br>${f.q.replace('（　　）', '<span style="color:var(--primary);">（　　）</span>')}`,
        sub: '', options, answer: options.indexOf(correct),
        desc: f.d + drillPatternNote(f.g)
      };
    }
    function makeOrderQuestion(o) {
      const slots = o.parts.map((p, i) => `<span class="order-slot ${i === o.star ? 'star' : ''}">${i === o.star ? '★' : '　'}</span>`).join('');
      const options = shuffle(o.parts);
      return {
        kind: 'gorder', src: o, drillId: o.id,
        q: `<span class="q-tag">文の組み立て · DAY ${drillDay(o)}</span><div class="order-line">${o.pre}${slots}${o.post}</div><span style="font-size:0.88rem; color:var(--text-muted); font-weight:normal;">네 조각을 바르게 놓았을 때 ★에 들어갈 것은?</span>`,
        sub: '', options, answer: options.indexOf(o.parts[o.star]),
        desc: `<b>${o.pre}${o.parts.map((p, i) => i === o.star ? `<u>${p}</u>` : p).join('')}${o.post}</b><br>${o.ko}<br><span style="font-size:0.84rem;">바른 순서: ${o.parts.join(' → ')}</span>` + drillPatternNote(o.g)
      };
    }

    function makeGrammarQuestion(g) {
      const correct = g.options[g.answer];
      const options = shuffle(g.options);
      return {
        kind: 'grammar', src: g,
        q: g.q,
        sub: g.level ? `<span style="font-size:0.78rem; color:var(--text-muted); font-weight:normal;">DAY ${g.day || '-'} · ${g.level}</span>` : '',
        options, answer: options.indexOf(correct), desc: g.desc
      };
    }

    // 문형 → 뜻 고르기: 오답 보기는 같은 기능 분류(예: 원인·이유)에서 우선 뽑아 헷갈리게
    function makePatternQuestion(g) {
      const same = shuffle(GREF.filter(x => x.id !== g.id && x.cat === g.cat)).map(x => x.m);
      const others = shuffle(GREF.filter(x => x.cat !== g.cat)).map(x => x.m);
      const distractors = Array.from(new Set([...same.slice(0, 2), ...others])).filter(m => m !== g.m).slice(0, 3);
      const options = shuffle([g.m, ...distractors]);
      return {
        kind: 'pattern', src: g,
        q: `<span style="font-size:1.4rem;">${g.p}</span><br><span style="font-size:0.92rem; font-weight:normal;">${g.ja}</span>`,
        sub: `<span style="font-size:0.78rem; color:var(--text-muted); font-weight:normal;">${g.level} · 이 문형의 뜻은?</span>`,
        options, answer: options.indexOf(g.m),
        desc: `<strong>${g.p}</strong> (${g.c})<br>${g.m}<br>${g.ko}${g.tip ? '<br>💡 ' + g.tip : ''}`
      };
    }

    function renderQuizQuestion() {
      const container = document.getElementById('quiz-container');
      if (currentQuizIdx >= currentQuizList.length) {
        renderQuizResult();
        return;
      }

      const q = currentQuizList[currentQuizIdx];
      quizAnswered = false;
      container.innerHTML = `
        <div class="quiz-card">
          <div class="quiz-head">
            <span>문제 ${currentQuizIdx + 1} / ${currentQuizList.length}</span>
            <span>정답 ${quizCorrect}개</span>
          </div>
          <div class="quiz-q">${q.q}</div>
          ${q.sub ? `<div style="color:var(--primary); margin-top:-10px; margin-bottom:14px; font-weight:600;">${q.sub}</div>` : ''}
          <div id="quiz-options">
            ${q.options.map((opt, i) => `
              <button class="quiz-opt" onclick="checkAnswer(${i}, this)">${'①②③④'[i]} ${opt}</button>
            `).join('')}
          </div>
          <div id="quiz-explanation" class="quiz-exp"></div>
          <button id="btn-next-quiz" class="btn btn-memorized" style="display:none; margin-top:14px; width:100%;" onclick="nextQuestion()">다음 문제 ➔</button>
        </div>
      `;
    }

    function checkAnswer(chosen, btn) {
      const q = currentQuizList[currentQuizIdx];
      const correct = q.answer;
      const allBtns = document.querySelectorAll('.quiz-opt');
      allBtns.forEach(b => b.disabled = true);
      quizAnswered = true;

      const exp = document.getElementById('quiz-explanation');

      if (chosen === correct) {
        quizCorrect++;
        btn.classList.add('correct');
        exp.innerHTML = `<strong>✔ 정답입니다!</strong><br>${q.desc}`;
        exp.className = 'quiz-exp ok';
        // 맞히면 오답 카운트를 1 줄여서 취약 목록에서 서서히 빠지도록
        if (q.wordId && studyState.quizWrongCount[q.wordId] > 0) {
          studyState.quizWrongCount[q.wordId]--;
          persist();
        }
      } else {
        btn.classList.add('wrong');
        allBtns[correct].classList.add('correct');
        exp.innerHTML = `<strong>✘ 오답입니다.</strong><br>${q.desc}`;
        exp.className = 'quiz-exp ng';
        quizWrongItems.push(q);

        if (q.wordId) {
          studyState.quizWrongCount[q.wordId] = (studyState.quizWrongCount[q.wordId] || 0) + 1;
          persist();
        }
      }

      if (q.drillId) { recordResult('d:' + q.drillId, chosen === correct); persist(); }
      if (q.kind === 'vocab') { vocabRecord(q.wordId, chosen === correct, q.vtype); persist(); }
      exp.style.display = 'block';
      const nextBtn = document.getElementById('btn-next-quiz');
      nextBtn.style.display = 'block';
      if (currentQuizIdx === currentQuizList.length - 1) nextBtn.textContent = '결과 보기 ➔';
    }

    function nextQuestion() {
      currentQuizIdx++;
      renderQuizQuestion();
    }

    function renderQuizResult() {
      const container = document.getElementById('quiz-container');
      const total = currentQuizList.length;
      const rate = total ? Math.round((quizCorrect / total) * 100) : 0;
      const wrongHtml = quizWrongItems.map(q => q.kind === 'vocab'
        ? `<div class="wrong-item"><div><div class="wrong-word-info">${q.word.word}${wrongReading(q.word)}</div><div class="wrong-word-sub">${q.word.mean}</div></div><span class="wrong-badge">${QTAG[q.vtype] || '뜻'}</span></div>`
        : q.kind === 'word'
        ? `<div class="wrong-item"><div><div class="wrong-word-info">${q.word.word}${wrongReading(q.word)}</div><div class="wrong-word-sub">${q.word.mean}</div></div></div>`
        : q.kind === 'pattern'
        ? `<div class="wrong-item"><div><div class="wrong-word-info">${q.src.p}</div><div class="wrong-word-sub">${q.src.m}</div></div></div>`
        : q.kind === 'usage'
        ? `<div class="wrong-item"><div><div class="wrong-word-info">用法: ${q.src.w}</div><div class="wrong-word-sub">${q.options[q.answer]}</div></div></div>`
        : q.kind === 'gpass'
        ? `<div class="wrong-item"><div><div class="wrong-word-info">文章の文法: ${q.src.ps.title} （${q.src.bi + 1}）</div><div class="wrong-word-sub">정답: ${q.options[q.answer]}</div></div></div>`
        : `<div class="wrong-item"><div><div class="wrong-word-sub" style="color:var(--heading);">${q.q.replace(/<span class="q-tag">.*?<\/span>(<br>)?/, '')}</div><div class="wrong-word-sub">정답: ${q.options[q.answer]}</div></div></div>`
      ).join('');
      // '오늘' 탭의 추가 과제: 틀린 문법·틀린 어휘는 그날 한 번 끝내면 완료, 어휘 실전 세트는 끝낸 횟수를 셈
      const extraKey = quizMeta.scope === 'gdrill' ? (gdrillMode === 'wrong' ? 'gwrong' : '') : quizMeta.scope === 'vwrong' ? 'vwrong' : '';
      if (extraKey && !quizMeta.preset && total > 0) { setStamp(`t:${todayStr()}-${extraKey}`, 1); persist(); }
      if (quizMeta.scope === 'vocab' && !quizMeta.preset && total > 0) { setStamp(`t:${todayStr()}-vset`, vocabSetsToday() + 1); persist(); }
      const vocabQuiz = currentQuizList.some(q => q.kind === 'vocab');
      container.innerHTML = `
        <div class="quiz-card" style="text-align:center; padding: 30px 16px;">
          <h2>🎉 퀴즈 세트 완료!</h2>
          <div class="score-big">${quizCorrect} / ${total}</div>
          <p style="color: var(--text-muted);">정답률 ${rate}% ${rate >= 80 ? '— 합격권입니다!' : rate >= 60 ? '— 조금만 더!' : '— 틀린 문제의 해설을 다시 읽어 보세요.'}${vocabQuiz && quizWrongItems.some(q => q.kind === 'vocab') ? '<br>틀린 단어는 내일 \'🔁 틀린 어휘 다시\'에 다른 유형으로 나옵니다.' : ''}</p>
          ${quizWrongItems.length ? `<div class="wrong-review-list"><div style="font-weight:700; margin:12px 0 4px;">틀린 문제 (${quizWrongItems.length})</div>${wrongHtml}</div>` : ''}
          <div class="btn-row">
            ${quizWrongItems.length ? `<button class="btn btn-review" onclick="retryWrong()">틀린 문제만 다시</button>` : ''}
            <button class="btn btn-memorized" onclick="quizAgain()">${quizMeta.scope === 'vocab' && !quizMeta.preset ? '다음 세트' : '새로 섞어서 다시'}</button>
          </div>
        </div>
      `;
    }

    function quizAgain() {
      if (quizMeta.preset && quizMeta.again) startQuiz(quizMeta.again(), quizMeta.again);
      else startQuiz();
    }
    function retryWrong() {
      const list = quizWrongItems.map(q => q.kind === 'vocab' ? { type: 'vocab', vtype: q.vtype, word: q.word }
        : q.drillId ? { type: 'drill', src: q.src }
        : { type: q.kind === 'pattern' ? 'pattern' : 'grammar', src: q.src });
      startQuiz(list);
    }

    // ===== 청해 탭 (TTS) =====
    const LTYPE = { quick: '즉시응답 · 問題4', task: '과제이해 · 問題1', point: '포인트이해 · 問題2', summary: '개요이해 · 問題3', integ: '통합이해 · 問題5' };
    const LBADGE = { quick: 'badge-short', task: 'badge-mid', point: 'badge-mid', summary: 'badge-extra', integ: 'badge-long' };
    const WHO = { M: '남', F: '여', M2: '남2', F2: '여2', N: '안내' };
    const NUM_JA = ['いち', 'に', 'さん', 'よん'];
    let listenMode = 'practice';
    let listenFilter = 'day';
    const listenShowText = {};   // 보기를 소리로만 듣는 유형에서 글자를 펼쳤는지
    const listenPicked = {};     // 'id-문항' → 이번에 고른 보기 위치
    const listenOrderCache = {}; // 보기 순서 섞기 (통합이해는 안내 순서대로 고정)
    let listenPlayingId = null;

    // 보기를 소리로만 듣는 유형: 즉시응답·개요이해·통합이해 1·2번형(질문 하나)
    function listenHidden(item) { return item.type === 'quick' || item.type === 'summary' || (item.type === 'integ' && item.qs.length === 1); }
    function listenOrder(item, qi) {
      const key = `${item.id}-${qi}`;
      if (!listenOrderCache[key]) {
        const idx = item.qs[qi].opts.map((_, i) => i);
        listenOrderCache[key] = item.type === 'integ' ? idx : shuffle(idx);
      }
      return listenOrderCache[key];
    }
    function listenResult(item) {
      const r = item.qs.map((q, qi) => stampV(`l:${item.id}-${qi}`));
      return { done: r.every(Boolean), any: r.some(Boolean), wrong: r.some(v => v === 'x'), ok: r.filter(v => v === 'o').length };
    }
    function listenItemsForDay(day) { return LISTEN.filter(x => x.day === day); }
    function listenItemsForView() {
      if (listenFilter === 'wrong') return [...LISTEN, ...SCENE_LISTEN].filter(x => listenResult(x).wrong);
      if (listenFilter === 'scene') return SCENE_LISTEN;
      if (listenFilter === 'quick') return LISTEN.filter(x => x.type === 'quick');
      if (listenFilter === 'dialog') return LISTEN.filter(x => ['task', 'point', 'summary'].includes(x.type));
      if (listenFilter === 'integ') return LISTEN.filter(x => x.type === 'integ');
      return listenItemsForDay(currentDay);
    }
    // 실제 시험 순서대로 재생 목록 만들기
    // 재생 순서. 두 사람 이상이 말하는 대화(audio/clips.js에 있는 문제)는 항목마다 음성 파일(clip)을 붙임
    //   키: intro(안내) · l줄 · q질문 · o질문-보기(원래 순서) / 보기 번호(いち·に…)는 목소리별 audio/num/목소리-번호.mp3
    // 녹음 파일이 없는 문제(혼자 말하는 독백)는 남자 대사도 기본 여성 목소리로 (음 높이를 낮춘 목소리는 알아듣기 어려움)
    function listenVoice(item, s) { return !clipInfo(item) && (s === 'M' || s === 'M2') ? 'F' : s; }
    function listenSequence(item) {
      const seq = [];
      const clip = clipInfo(item) ? key => `audio/${item.id}/${key}.mp3` : () => null;
      const lines = item.lines.map((l, i) => ({ s: listenVoice(item, l[0]), text: l[1], gap: 550, clip: clip('l' + i) }));
      const other = s => (s === 'M' || s === 'M2') ? 'F' : 'M';
      // 보기 읽기: 번호 → 짧게 쉬고 → 보기
      const option = (s, qi, oi, pos, text) => [{ s, text: NUM_JA[pos], gap: 200, clip: clipNumber(item, s, pos) }, { s, text, gap: 700, clip: clip(`o${qi}-${oi}`) }];
      if (item.type === 'quick') {
        seq.push(...lines, { pause: 600 });
        const s = other(item.lines[0][0]);
        listenOrder(item, 0).forEach((oi, pos) => seq.push(...option(s, 0, oi, pos, item.qs[0].opts[oi])));
        return seq;
      }
      seq.push({ s: 'N', text: item.intro, gap: 700, clip: clip('intro') });
      if (item.type === 'point') seq.push({ pause: 6000 });   // 보기를 읽을 시간 (실제 시험은 약 20초)
      seq.push(...lines, { pause: 700 });
      item.qs.forEach((q, qi) => {
        seq.push({ s: 'N', text: q.q.replace(/^質問(\d)　/, '質問$1。'), gap: 800, clip: clip('q' + qi) });
        if (listenHidden(item)) listenOrder(item, qi).forEach((oi, pos) => seq.push(...option('N', qi, oi, pos, q.opts[oi])));
      });
      return seq;
    }
    function playListen(id) {
      const item = listenById.get(id);
      if (!item) return;
      listenPlayingId = id;
      refreshListenCard(id);
      keepAwake(true);
      speakSeq(listenSequence(item), () => { listenPlayingId = null; refreshListenCard(id); keepAwake(false); });
    }
    function stopListen() {
      const id = listenPlayingId;
      listenPlayingId = null;
      stopSpeech();
      keepAwake(false);
      if (id) refreshListenCard(id);
    }
    function toggleListenText(id) { listenShowText[id] = !listenShowText[id]; refreshListenCard(id); }
    function toggleListenScript(btn) {
      const box = btn.parentElement.querySelector('.listen-script');
      const open = box.style.display === 'block';
      box.style.display = open ? 'none' : 'block';
      btn.textContent = open ? '📜 스크립트·해석 보기' : '▲ 스크립트 접기';
    }
    function answerListen(id, qi, pos) {
      const item = listenById.get(id), q = item.qs[qi];
      const chosen = listenOrder(item, qi)[pos];
      listenPicked[`${id}-${qi}`] = pos;
      recordResult(`l:${id}-${qi}`, chosen === q.a);
      persist();
      refreshListenCard(id);
    }
    function refreshListenCard(id) {
      const el = document.getElementById(`lc-${id}`), item = listenById.get(id);
      if (el && item) el.outerHTML = listenCardHtml(item);
    }
    function listenCardHtml(item) {
      const res = listenResult(item);
      const hidden = listenHidden(item), showText = listenShowText[item.id];
      const answeredNow = item.qs.every((q, qi) => listenPicked[`${item.id}-${qi}`] != null);
      const playing = listenPlayingId === item.id;
      const status = res.done ? (res.wrong ? `<span class="listen-status ng">✗ 지난 결과 ${res.ok}/${item.qs.length}</span>` : `<span class="listen-status ok">✓ 맞힘</span>`) : '<span class="listen-status" style="color:var(--text-muted);">미응시</span>';
      const qsHtml = item.qs.map((q, qi) => {
        const ord = listenOrder(item, qi);
        const picked = listenPicked[`${item.id}-${qi}`];
        const answered = picked != null;
        const reveal = answered || showText || !hidden;
        const qText = item.type === 'quick' ? '' : (hidden && !answered ? '' : `<div class="listen-q">${q.q}${answered && q.qKo ? `<br><span class="script-ko">${q.qKo}</span>` : ''}</div>`);
        const opts = ord.map((oi, pos) => {
          let cls = 'listen-opt';
          if (answered) { if (oi === q.a) cls += ' correct'; else if (pos === picked) cls += ' wrong'; }
          const label = reveal ? `${pos + 1}. ${q.opts[oi]}${answered && q.ok ? `<br><span class="script-ko">${q.ok[oi]}</span>` : ''}` : `${pos + 1}`;
          return `<button class="${cls}" ${answered ? 'disabled' : ''} onclick="answerListen('${item.id}', ${qi}, ${pos})">${label}</button>`;
        }).join('');
        const numCls = reveal ? '' : ` num${ord.length === 3 ? ' n3' : ''}`;
        return `${qText}<div class="listen-opts${numCls}">${opts}</div>${answered ? `<div class="listen-exp">${q.d}</div>` : ''}`;
      }).join('<div style="height:10px;"></div>');
      const script = `<div class="listen-script">
          ${item.intro ? `<div class="script-line" data-tts="${escapeHtml(item.intro)}" data-who="N"${clipInfo(item) ? ` data-clip="audio/${item.id}/intro.mp3"` : ''}><span class="script-who">안내</span><div>${item.intro}<div class="script-ko">${item.introKo || ''}</div></div></div>` : ''}
          ${item.lines.map((l, li) => `<div class="script-line" data-tts="${escapeHtml(l[1])}" data-who="${listenVoice(item, l[0])}"${clipInfo(item) ? ` data-clip="audio/${item.id}/l${li}.mp3"` : ''}><span class="script-who">${WHO[l[0]] || l[0]}</span><div>${l[3] || l[1]}<div class="script-ko">${l[2]}</div></div></div>`).join('')}
          ${item.scriptExtra || ''}
        </div>`;
      return `<div class="listen-card" id="lc-${item.id}">
        <div class="listen-head"><span><span class="badge ${LBADGE[item.type]}">${LTYPE[item.type]}</span> <span class="char-count">${item.label ? `🎬 ${item.label}` : item.day ? `DAY ${item.day}` : '실전 대비'}</span></span>${status}</div>
        <div class="listen-controls">
          <button class="btn ${playing ? 'btn-plain' : 'btn-primary'}" onclick="${playing ? 'stopListen()' : `playListen('${item.id}')`}">${playing ? '<span class="speaking-dot"></span>⏹ 정지' : (res.any || answeredNow ? '🔁 다시 듣기' : '▶ 듣기')}</button>
          ${hidden && !answeredNow ? `<button class="btn btn-plain" onclick="toggleListenText('${item.id}')">${showText ? '보기 글자 숨기기' : '보기 글자 보기'}</button>` : ''}
        </div>
        ${hidden && !answeredNow && !showText ? `<div style="font-size:0.78rem; color:var(--text-muted); margin-bottom:8px;">${item.type === 'quick' ? '실제 시험처럼 문장과 보기 3개를 소리로만 듣고 번호를 고르세요.' : '이야기를 다 들은 뒤 질문과 보기 4개가 소리로 나옵니다.'}</div>` : ''}
        ${item.type === 'point' && !answeredNow ? `<div style="font-size:0.78rem; color:var(--text-muted); margin-bottom:8px;">질문을 먼저 듣고, 6초 동안 보기를 읽은 뒤 대화가 나옵니다.</div>` : ''}
        ${qsHtml}
        <button class="btn btn-plain" style="width:100%; margin-top:12px;" onclick="toggleListenScript(this)">📜 스크립트·해석 보기</button>
        ${script}
      </div>`;
    }
    function renderListenVoiceInfo() {
      const el = document.getElementById('listen-voice-info');
      if (!el) return;
      const rate = Number(prefs.ttsRate) || 0.95;
      const m = jaVoices().some(v => MALE_RE.test(v.name));
      el.innerHTML = `🎧 이어폰을 끼고 <b>한 번만 듣고</b> 푸는 연습을 하세요. 틀린 문제는 스크립트를 보며 문장별로 다시 들을 수 있습니다.
        <div class="seg" style="margin-top:8px;">${[[0.8, '느리게'], [0.95, '보통'], [1.08, '실전 속도']].map(([v, l]) => `<button class="${rate === v ? 'active' : ''}" onclick="setPref('ttsRate', ${v}); renderListenVoiceInfo();">${l}</button>`).join('')}</div>
        <div style="font-size:0.74rem; margin-top:6px; color:var(--text-muted);">${typeof AUDIO_CLIPS !== 'undefined' ? `두 사람 이상이 말하는 대화는 화자마다 다른 목소리로 녹음한 음성 파일로 재생하고, 혼자 말하는 문제는 기기 음성으로 읽습니다. <span style="opacity:0.8;">(대화 음성: ${AUDIO_CLIPS.credit})</span>` : jaVoices().length ? (m ? '남·여 목소리를 나눠 재생합니다.' : '남성 목소리가 없는 기기라 높낮이로 남·여를 구분합니다 (설정 ⚙️ › 음성 확인).') : '일본어 목소리를 찾는 중… 소리가 안 나면 기기 TTS 설정에서 일본어를 추가하세요.'}</div>`;
    }
    function renderListen() {
      renderListenVoiceInfo();
      document.getElementById('lmode-practice').classList.toggle('active', listenMode === 'practice');
      document.getElementById('lmode-audio').classList.toggle('active', listenMode === 'audio');
      document.getElementById('listen-practice').style.display = listenMode === 'practice' ? 'block' : 'none';
      document.getElementById('listen-audio').style.display = listenMode === 'audio' ? 'block' : 'none';
      document.querySelectorAll('#listen-filter-bar .chip-sm').forEach(c => c.classList.toggle('active', c.dataset.lfilter === listenFilter));
      if (listenMode === 'audio') { renderAudioMode(); return; }
      const listEl = document.getElementById('listen-list');
      const items = listenItemsForView();
      if (!items.length) {
        listEl.innerHTML = `<div class="empty-box">${listenFilter === 'wrong' ? '🎉 틀린 청해 문제가 없습니다.' : `DAY ${currentDay}에는 청해 문제가 없습니다.`}</div>`;

    }
    function setListenFilter(f, btn) {
      listenFilter = f;
      stopListen();
      renderListen();
    }
    function setListenMode(mode) {
      if (mode !== listenMode) { stopListen(); stopAudioMode(); }
      listenMode = mode;
      renderListen();
    }

    // ===== 단어 듣기 모드 (이동 중 화면을 안 봐도 되는 오디오 단어장) =====
    // 범위: wrong(다시 볼 어휘) · today(오늘 문제로 푼 어휘) · scene(장면 색인에서 고른 장면) · rand(무작위 50개, 어휘 탭의 N3·N2·N1 범위)
    const AUDIO_SOURCES = ['wrong', 'today', 'scene', 'rand'];
    const audio = { source: 'wrong', order: 'ja', withEx: true, list: [], idx: 0, playing: false, step: 0 };
    try { Object.assign(audio, JSON.parse(localStorage.getItem('jlpt_audio_opts') || '{}')); audio.playing = false; audio.list = []; } catch (e) {}
    if (!AUDIO_SOURCES.includes(audio.source)) audio.source = 'wrong';   // 예전 범위(DAY·세션·오늘의 복습·헷갈림)
    function saveAudioOpts() { try { localStorage.setItem('jlpt_audio_opts', JSON.stringify({ source: audio.source, order: audio.order, withEx: audio.withEx })); } catch (e) {} }
    function audioTodayWords() { const t0 = startOfToday(); return VOCAB.filter(w => stampT('v:' + w.id) >= t0); }
    function audioSourceList() {
      if (audio.source === 'scene') { const sc = sceneById.get(sceneSel); return sc ? sceneVisibleWords(sc) : []; }
      if (audio.source === 'today') return audioTodayWords();
      if (audio.source === 'rand') return shuffle(vocabPool()).slice(0, 50);
      return vocabCycleWords().sort((a, b) => vstat(a.id).d.localeCompare(vstat(b.id).d));
    }
    function audioExample(w) { const ex = (w.examples || [])[0]; return ex ? ex : null; }
    function audioSeq(w) {
      const ex = audio.withEx ? audioExample(w) : null;
      if (audio.order === 'ko') {
        // 뜻 먼저 → 떠올릴 시간 → 단어 → 예문
        return [{ s: 'KO', text: w.mean, gap: 300 }, { pause: 2200 }, { s: 'F', text: w.word, gap: 700 }, ...(ex ? [{ s: 'F', text: ex.ja, gap: 900 }] : [{ pause: 600 }])];
      }
      return [{ s: 'F', text: w.word, gap: 500 }, { pause: 900 }, { s: 'KO', text: w.mean, gap: 600 }, ...(ex ? [{ s: 'F', text: ex.ja, gap: 900 }] : [{ pause: 600 }])];
    }
    function startAudioMode() {
      if (!audio.list.length || audio.idx >= audio.list.length) { audio.list = audioSourceList(); audio.idx = 0; }
      if (!audio.list.length) { renderAudioMode(); return; }
      audio.playing = true;
      keepAwake(true);
      playAudioWord();
    }
    function playAudioWord() {
      if (!audio.playing) return;
      const w = audio.list[audio.idx];
      if (!w) { stopAudioMode(true); return; }
      audio.step = 0;
      renderAudioMode();
      speakSeq(audioSeq(w), () => {
        if (!audio.playing) return;
        audio.idx++;
        if (audio.idx >= audio.list.length) { stopAudioMode(true); return; }
        playAudioWord();
      }, step => { audio.step = step; updateAudioReveal(); });
    }
    function pauseAudioMode() { audio.playing = false; stopSpeech(); keepAwake(false); renderAudioMode(); }
    function stopAudioMode(finished) {
      const was = audio.playing;
      audio.playing = false;
      if (was) stopSpeech();
      keepAwake(false);
      if (finished) { audio.idx = audio.list.length; }
      if (document.getElementById('listen-audio') && listenMode === 'audio') renderAudioMode();
    }
    function audioJump(delta) {
      if (!audio.list.length) audio.list = audioSourceList();
      audio.idx = Math.max(0, Math.min(audio.list.length - 1, audio.idx + delta));
      if (audio.playing) playAudioWord(); else renderAudioMode();
    }
    function setAudioOpt(key, val) {
      audio[key] = val;

      if (key === 'source') { audio.list = []; audio.idx = 0; if (audio.playing) pauseAudioMode(); }
      renderAudioMode();
    }
    // 헷갈리는 단어 → 내일 '틀린 어휘 다시'에 문제로
    function audioMark() {
      const w = audio.list[audio.idx];
      if (!w || !curriculumIds.has(w.id)) return;
      vocabFlag(w.id);
      persist();
      renderAudioMode();
    }
    function updateAudioReveal() {
      // 한→일 순서일 때는 단어를 말하기 시작하는 순간 화면에도 보여 줌
      const hideWord = audio.order === 'ko' && audio.playing && audio.step < 2;
      const el = document.getElementById('audio-word-box');
      if (el) el.style.visibility = hideWord ? 'hidden' : 'visible';
    }
    function renderAudioMode() {
      const el = document.getElementById('listen-audio');

      const ex = w ? audioExample(w) : null;
      const sc = sceneById.get(sceneSel);
      el.innerHTML = `
        <div class="info-banner">🚶 이동 중에는 화면을 켜 둔 채 이어폰으로 들으세요. 재생하는 동안 화면이 꺼지지 않게 합니다 (지원 기기).${koVoice() ? '' : '<br>이 기기에는 한국어 목소리가 없어 뜻은 화면에만 표시됩니다.'}</div>
        <div class="stat-box" style="padding:12px 16px;">
          <div class="opt-row"><span>범위</span><select onchange="setAudioOpt('source', this.value)">
            ${[['wrong', `다시 볼 어휘 (${vocabCycleWords().length})`], ['today', `오늘 문제로 푼 어휘 (${audioTodayWords().length})`], ['scene', sc ? `장면: ${sc.title} (${sceneCount(sc)})` : '어휘 탭 장면 색인에서 고른 장면'], ['rand', `무작위 50개 (${vocabLevel === 'all' ? '전체' : vocabLevel})`]]
              .map(([v, l]) => `<option value="${v}" ${audio.source === v ? 'selected' : ''}>${l}</option>`).join('')}
          </select></div>
          <div class="opt-row"><span>순서</span><div class="seg">
            <button class="${audio.order === 'ja' ? 'active' : ''}" onclick="setAudioOpt('order','ja')">일본어 → 뜻</button>

        </div>
        ${!total ? `<div class="empty-box">${audio.source === 'wrong' ? '다시 볼 어휘가 없습니다. 어휘 문제에서 틀린 단어가 여기에 모입니다.' : audio.source === 'today' ? '오늘 어휘 문제로 푼 단어가 없습니다.' : '이 범위에는 단어가 없습니다.'}</div>` : `
        <div class="audio-stage">

          ${w && !finished ? `

            <div class="btn-row" style="margin-top:14px;">
              <button class="btn btn-review ${flagged ? 'active' : ''}" onclick="audioMark()" ${flagged ? 'disabled' : ''}>${flagged ? '🔁 다시 볼 단어' : '❓ 헷갈림 → 내일 문제로'}</button>
            </div>` : ''}

            <button class="btn btn-plain" onclick="audioJump(-1)" aria-label="이전">⏮</button>
            ${audio.playing ? `<button class="btn btn-primary" onclick="pauseAudioMode()" aria-label="일시정지">⏸</button>`
              : `<button class="btn btn-primary" onclick="${finished ? 'audio.idx = 0; ' : ''}startAudioMode()" aria-label="재생">▶</button>`}
            <button class="btn btn-plain" onclick="audioJump(1)" aria-label="다음">⏭</button>
          </div>
        </div>`}`;
      updateAudioReveal();
    }
    function openAudioMode() {
      switchTab('listen');
      setListenMode('audio');
    }

    // ===== 모의고사 =====
    // 언어지식(문자·어휘·문법) / 독해 / 청해 — 각 60점 환산, 합계 90점 이상 + 영역별 19점 이상이면 합격권
    const MOCK_PLAN = {
      mini: { label: '미니 모의고사', min: 30,
        lang: { kanji: 2, hyouki: 2, gokei: 1, context: 2, syn: 1, usage: 1, gfill: 3, gorder: 1 },
        read: { short: 1, mid: 1 }, listen: { quick: 3, task: 1 } },
      full: { label: '실전형 모의고사', min: 100,
        lang: { kanji: 5, hyouki: 5, gokei: 3, context: 6, syn: 4, usage: 4, gfill: 10, gorder: 4, gpass: 1 },
        read: { short: 2, mid: 2, long: 1, extra: 1 }, listen: { quick: 8, task: 2, point: 2, summary: 2, integ: 1 } },
      // 본시험형: 공식 문제 구성 기준 문항 수(회차마다 조금 다를 수 있음). 1교시 언어지식·독해 105분 → 쉬는 시간 → 2교시 청해 50분
